name: Package Validation

on:
  pull_request:

concurrency:
  group: package-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate_packages:
    name: Validate NuGet Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: make restore

      - name: Pack and verify package set
        shell: bash
        run: |
          rm -rf nupkg
          make pack

          mapfile -t packages < <(find nupkg -maxdepth 1 -type f -name '*.nupkg' -printf '%f\n' | sort)
          printf 'Produced packages:\n%s\n' "${packages[*]}"

          if [ "${#packages[@]}" -ne 4 ]; then
            echo "Expected exactly 4 NuGet packages, found ${#packages[@]}." >&2
            exit 1
          fi

          for package_id in ArchLinterNet.CEL ArchLinterNet.Core ArchLinterNet.Cli ArchLinterNet.Testing; do
            matches=0
            for package in "${packages[@]}"; do
              if [[ "$package" == "$package_id".*.nupkg ]]; then
                matches=$((matches + 1))
              fi
            done

            if [ "$matches" -ne 1 ]; then
              echo "Expected exactly one package for $package_id, found $matches." >&2
              exit 1
            fi
          done

          if printf '%s\n' "${packages[@]}" | grep -q '^ArchLinterNet\.Unity\.'; then
            echo 'ArchLinterNet.Unity package must not be produced.' >&2
            exit 1
          fi

          cel_nupkg=$(printf '%s\n' "${packages[@]}" | grep '^ArchLinterNet\.CEL\.')
          cel_nuspec=$(unzip -p "nupkg/$cel_nupkg" '*.nuspec')
          cel_listing=$(unzip -Z1 "nupkg/$cel_nupkg")

          if printf '%s\n' "$cel_nuspec" | grep -q '<dependency '; then
            echo "ArchLinterNet.CEL .nuspec must declare no dependencies (it must remain a self-contained leaf package)." >&2
            exit 1
          fi

          for required_entry in README.md lib/net10.0/ArchLinterNet.CEL.dll lib/net10.0/ArchLinterNet.CEL.xml; do
            if ! printf '%s\n' "$cel_listing" | grep -qxF "$required_entry"; then
              echo "ArchLinterNet.CEL package is missing required entry '$required_entry' (README and XML API docs must ship in the package)." >&2
              exit 1
            fi
          done

          # Forbidden content: any Core/CLI/Testing assembly, an asset that would pull in YAML
          # loading, JSON schema, MSBuild/Buildalyzer, or Roslyn compilation by library name, or
          # a raw YAML/JSON-schema file of any origin (not just from a named dependency).
          cel_forbidden_pattern='ArchLinterNet\.(Core|Cli|Testing)\.(dll|xml)$|YamlDotNet|JsonSchema\.Net|Buildalyzer|Microsoft\.CodeAnalysis|Microsoft\.Extensions\.DependencyInjection|System\.Security\.Cryptography\.Xml|\.ya?ml$|\.schema\.json$'
          if printf '%s\n' "$cel_listing" | grep -Ei "$cel_forbidden_pattern"; then
            echo "ArchLinterNet.CEL package contains forbidden content (see entries above): must not embed Core/CLI/Testing assemblies, YAML/JSON-schema/Buildalyzer/Roslyn assets, or raw .yml/.yaml/.schema.json files." >&2
            exit 1
          fi

          cel_package_version=$(printf '%s\n' "$cel_nuspec" | grep -oE '<version>[^<]+</version>' | head -1 | sed -E 's#</?version>##g')
          echo "Detected ArchLinterNet.CEL package version: $cel_package_version"

          core_nupkg=$(printf '%s\n' "${packages[@]}" | grep '^ArchLinterNet\.Core\.')
          core_nuspec=$(unzip -p "nupkg/$core_nupkg" '*.nuspec')
          core_listing=$(unzip -Z1 "nupkg/$core_nupkg")

          for required_schema in \
            analysis-build-state.schema.json \
            analysis-cache.schema.json \
            analysis-profile.schema.json \
            api-snapshot.schema.json \
            baseline.schema.json \
            normalized-finding.schema.json; do
            required_entry="contentFiles/any/any/schema/0.5.1/$required_schema"
            if ! printf '%s\n' "$core_listing" | grep -qxF "$required_entry"; then
              echo "Core package is missing release-matched schema '$required_entry'." >&2
              exit 1
            fi
          done

          # Policy root/fragment, baseline, normalized findings, and the analysis-cache current contracts
          # advance to 0.8.0. The frozen 0.5.1 and 0.6.1 finding/cache resources remain packaged
          # below for offline legacy validation; the manifest resolves the current generation (see
          # schema/0.8.0/compatibility-manifest.json).
          for required_schema in \
            compatibility-manifest.json \
            dependencies.arch.fragment.schema.json \
            dependencies.arch.schema.json \
            baseline.schema.json \
            normalized-finding.schema.json \
            analysis-cache.schema.json; do
            required_entry="contentFiles/any/any/schema/0.8.0/$required_schema"
            if ! printf '%s\n' "$core_listing" | grep -qxF "$required_entry"; then
              echo "Core package is missing release-matched schema '$required_entry'." >&2
              exit 1
            fi
          done

          # Frozen v2 normalized-finding and v1 analysis-cache 0.6.1 resources remain separate
          # legacy invariants alongside the current 0.8.0 generation.
          for required_schema in \
            normalized-finding.schema.json \
            analysis-cache.schema.json; do
            required_entry="contentFiles/any/any/schema/0.6.1/$required_schema"
            if ! printf '%s\n' "$core_listing" | grep -qxF "$required_entry"; then
              echo "Core package is missing release-matched schema '$required_entry'." >&2
              exit 1
            fi
          done

          core_cel_dependency=$(printf '%s\n' "$core_nuspec" | grep -oE '<dependency id="ArchLinterNet\.CEL"[^/]*/>')
          if [ -z "$core_cel_dependency" ]; then
            echo "Core .nuspec does not declare ArchLinterNet.CEL as a dependency." >&2
            exit 1
          fi

          core_cel_dependency_version=$(printf '%s\n' "$core_cel_dependency" | grep -oE 'version="[^"]+"' | cut -d'"' -f2)
          if [ "$core_cel_dependency_version" != "$cel_package_version" ]; then
            echo "Core declares ArchLinterNet.CEL dependency version '$core_cel_dependency_version' but the packed ArchLinterNet.CEL package version is '$cel_package_version'." >&2
            exit 1
          fi

          if printf '%s\n' "$core_listing" | grep -qxF 'lib/net10.0/ArchLinterNet.CEL.dll'; then
            echo "Core package must not embed ArchLinterNet.CEL.dll; ArchLinterNet.CEL must be a declared dependency only." >&2
            exit 1
          fi

          echo "cel_nupkg=$cel_nupkg" >> "$GITHUB_ENV"
          cli_nupkg=$(printf '%s\n' "${packages[@]}" | grep '^ArchLinterNet\.Cli\.')
          echo "cli_nupkg=$cli_nupkg" >> "$GITHUB_ENV"

      - name: Offline packaged schema tool smoke test
        shell: bash
        run: |
          set -euo pipefail

          cli_version=$(printf '%s\n' "$cli_nupkg" | sed -E 's/^ArchLinterNet\.Cli\.(.+)\.nupkg$/\1/')
          cli_assembly_version=$(printf '%s\n' "$cli_version" | sed -E 's/[-+].*$//')
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT

          pushd "$smoke_dir" >/dev/null
          dotnet tool install ArchLinterNet.Cli --tool-path tool --add-source "$GITHUB_WORKSPACE/nupkg" --version "$cli_version" --ignore-failed-sources
          ./tool/arch-linter-net --version > version.txt
          ./tool/arch-linter-net schema list > schemas.txt
          # The CLI's established --version contract uses the three-part assembly version,
          # while NuGet package versions may include a prerelease or build suffix.
          grep -qF "$cli_assembly_version" version.txt
          grep -qx $'policy-root\tv1\thttps://archlinternet.dev/schema/0.8.0/dependencies.arch.schema.json\tschema/0.8.0/dependencies.arch.schema.json' schemas.txt
          grep -qx $'normalized-finding\tv3\thttps://archlinternet.dev/schema/0.8.0/normalized-finding.schema.json\tschema/0.8.0/normalized-finding.schema.json' schemas.txt
          grep -qx $'analysis-cache\tv1\thttps://archlinternet.dev/schema/0.8.0/analysis-cache.schema.json\tschema/0.8.0/analysis-cache.schema.json' schemas.txt
          grep -qx $'analysis-profile\tv1\thttps://archlinternet.dev/schema/0.5.1/analysis-profile.schema.json\tschema/0.5.1/analysis-profile.schema.json' schemas.txt
          ./tool/arch-linter-net schema print policy-root > printed-schema.json
          ./tool/arch-linter-net schema print normalized-finding > printed-normalized-finding-schema.json
          ./tool/arch-linter-net schema print analysis-cache > printed-analysis-cache-schema.json
          ./tool/arch-linter-net schema print analysis-profile > printed-analysis-profile-schema.json

          core_nupkg=$(printf '%s\n' "$GITHUB_WORKSPACE"/nupkg/ArchLinterNet.Core.*.nupkg)
          unzip -p "$core_nupkg" contentFiles/any/any/schema/0.8.0/dependencies.arch.schema.json > packaged-schema.json
          unzip -p "$core_nupkg" contentFiles/any/any/schema/0.8.0/normalized-finding.schema.json > packaged-normalized-finding-schema.json
          unzip -p "$core_nupkg" contentFiles/any/any/schema/0.8.0/analysis-cache.schema.json > packaged-analysis-cache-schema.json
          unzip -p "$core_nupkg" contentFiles/any/any/schema/0.5.1/analysis-profile.schema.json > packaged-analysis-profile-schema.json
          unzip -p "$core_nupkg" contentFiles/any/any/schema/0.5.1/normalized-finding.schema.json > frozen-normalized-finding-schema.json
          unzip -p "$core_nupkg" contentFiles/any/any/schema/0.5.1/analysis-cache.schema.json > frozen-analysis-cache-schema.json
          unzip -p "$core_nupkg" contentFiles/any/any/schema/0.6.1/normalized-finding.schema.json > legacy-normalized-finding-schema.json
          unzip -p "$core_nupkg" contentFiles/any/any/schema/0.6.1/analysis-cache.schema.json > legacy-analysis-cache-schema.json
          cmp printed-schema.json packaged-schema.json
          cmp printed-normalized-finding-schema.json packaged-normalized-finding-schema.json
          cmp printed-analysis-cache-schema.json packaged-analysis-cache-schema.json
          cmp printed-analysis-profile-schema.json packaged-analysis-profile-schema.json
          cmp "$GITHUB_WORKSPACE/schema/0.5.1/normalized-finding.schema.json" frozen-normalized-finding-schema.json
          cmp "$GITHUB_WORKSPACE/schema/0.5.1/analysis-cache.schema.json" frozen-analysis-cache-schema.json
          cmp "$GITHUB_WORKSPACE/schema/0.6.1/normalized-finding.schema.json" legacy-normalized-finding-schema.json
          cmp "$GITHUB_WORKSPACE/schema/0.6.1/analysis-cache.schema.json" legacy-analysis-cache-schema.json
          sha256sum printed-schema.json
          sha256sum printed-normalized-finding-schema.json
          sha256sum printed-analysis-cache-schema.json
          sha256sum printed-analysis-profile-schema.json
          popd >/dev/null

          unzip -p "$GITHUB_WORKSPACE/nupkg/$cli_nupkg" README.md > packaged-readme.md
          grep -qF 'YAML-first architecture governance for .NET repositories.' packaged-readme.md
          grep -qF '/guides/upgrading/' packaged-readme.md
          if grep -Eq 'public adoption package line|migration-to-[0-9]+-[0-9]+-[0-9]+' packaged-readme.md; then
            echo 'Packaged README contains release-version-coupled evergreen documentation wording.' >&2
            exit 1
          fi
          if grep -qF '/schema/0.6.0/' "$smoke_dir/schemas.txt"; then
            echo 'Installed schema list advertises an unsupported 0.6.0 schema identity.' >&2
            exit 1
          fi

      # Issue #741: proves the packed CLI binds a repository-local SARIF artifact to a declared
      # external_evidence requirement end to end through a real installed `arch-linter-net` tool —
      # not a synthetic in-process ForcedOutcome — and that --cache never lets a stale SARIF override
      # a fresh re-read, with no duplicate applicability record accumulating across a --cache
      # populating run followed by a re-invocation with changed evidence.
      - name: External evidence binding smoke test
        shell: bash
        run: |
          set -euo pipefail

          cli_version=$(printf '%s\n' "$cli_nupkg" | sed -E 's/^ArchLinterNet\.Cli\.(.+)\.nupkg$/\1/')
          evidence_dir=$(mktemp -d)
          trap 'rm -rf "$evidence_dir"' EXIT

          dotnet tool install ArchLinterNet.Cli --tool-path "$evidence_dir/tool" \
            --add-source "$GITHUB_WORKSPACE/nupkg" --version "$cli_version" --ignore-failed-sources

          # A minimal real project, not a synthetic in-process outcome: the packed CLI's project
          # discovery/build-state preflight requires at least one resolvable, built project — there
          # is no way to exercise the real validate seam without one.
          mkdir -p "$evidence_dir/repo/evidence"
          pushd "$evidence_dir/repo" >/dev/null
          dotnet new classlib -n App.Domain -o . --force >/dev/null
          dotnet build App.Domain.csproj >/dev/null

          cat > policy.arch.yml <<'POLICY'
          version: 1
          name: ExternalEvidenceSmokeTest
          layers:
            domain:
              namespace: App.Domain
          analysis:
            projects:
              - App.Domain.csproj
          contracts:
            strict: []
          external_evidence:
            - id: static-analysis
              format: sarif
              required: true
              tool: Synthetic.Scanner
              tool_version: "1.0"
              run: ci
              require_repository: true
              require_revision: true
              require_scope: true
              diagnostic_filter:
                severity:
                  warning: audit
          POLICY

          write_sarif() {
            cat > evidence/scan.sarif <<SARIF
          {"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Synthetic.Scanner","version":"1.0","rules":[{"id":"SEC100"}]}},"automationDetails":{"id":"ci"},"invocations":[{"executionSuccessful":true}],"versionControlProvenance":[{"repositoryUri":"repo","revisionId":"rev1"}],"results":[{"ruleId":"SEC100","level":"warning","message":{"text":"$1"},"locations":[{"physicalLocation":{"artifactLocation":{"uri":"src/App/One.cs"},"region":{"startLine":1,"startColumn":1}}}]}]}]}
          SARIF
          }

          run_cli() {
            "$evidence_dir/tool/arch-linter-net" --policy policy.arch.yml --format json \
              --external-evidence "id=static-analysis,path=evidence/scan.sarif,scope=ci" \
              --evidence-repository repo --evidence-revision "$1" --evidence-scope ci \
              --cache .cache --ensure-built --no-restore
          }

          write_sarif "first finding"
          run_cli rev1 > first-run.json
          jq -e '(.imported_diagnostics | length) == 1' first-run.json
          grep -qF 'first finding' first-run.json
          jq -e '[.assessment_completion.controls[] | select(.control_identity == "static-analysis")] | length == 1' first-run.json
          jq -e '.assessment_completion.controls[] | select(.control_identity == "static-analysis") | .state == "evaluable"' first-run.json

          # Same --cache destination, changed SARIF bytes: the contract requires a fresh re-read on
          # every invocation, never a stale reuse of the first run's trusted evidence, and exactly
          # one applicability record for the control — not two accumulated across the two runs.
          write_sarif "second finding"
          run_cli rev1 > second-run.json
          jq -e '(.imported_diagnostics | length) == 1' second-run.json
          grep -qF 'second finding' second-run.json
          if grep -qF 'first finding' second-run.json; then
            echo 'Stale --cache result: second run still reflects the first SARIF content.' >&2
            exit 1
          fi
          jq -e '[.assessment_completion.controls[] | select(.control_identity == "static-analysis")] | length == 1' second-run.json

          # Wrong revision: the same required-evidence trust boundary #520 enforces at the Core
          # boundary must still hold through the packed CLI — exit 2, not a clean pass.
          set +e
          run_cli wrong-revision > third-run.json
          third_exit=$?
          set -e
          if [ "$third_exit" -ne 2 ]; then
            echo "Expected exit code 2 for wrong-revision required evidence, got $third_exit." >&2
            cat third-run.json >&2
            exit 1
          fi
          jq -e '.assessment_completion.state == "unassessable"' third-run.json

          popd >/dev/null

      - name: External consumer smoke test
        shell: bash
        run: |
          set -euo pipefail

          cel_version=$(printf '%s\n' "$cel_nupkg" | sed -E 's/^ArchLinterNet\.CEL\.(.+)\.nupkg$/\1/')
          echo "Detected ArchLinterNet.CEL package version: $cel_version"

          nupkg_dir="$(pwd)/nupkg"
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT

          pushd "$smoke_dir" >/dev/null

          dotnet new console --no-restore >/dev/null

          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-cel" value="$nupkg_dir" />
            </packageSources>
          </configuration>
          EOF

          cat > Program.cs <<'CSEOF'
          using ArchLinterNet.CEL;
          using ArchLinterNet.CEL.Profile;
          using ArchLinterNet.CEL.Schema;
          using ArchLinterNet.CEL.Values;

          // Proves the packed ArchLinterNet.CEL.nupkg (not a ProjectReference) is independently
          // consumable: define a schema, compile a Profile v1 predicate, and evaluate it.
          var schemaBuilder = CelContextSchema.CreateBuilder("smoke-test-v1");
          var flag = schemaBuilder.AddVariable("flag", CelType.Bool);
          var schema = schemaBuilder.Build();

          var environment = CelEnvironment.CreateBuilder(CelProfile.V1)
              .WithContextSchema(schema)
              .Build();

          var compilation = environment.CompilePredicate("flag == true");
          if (!compilation.IsSuccess)
          {
              Console.Error.WriteLine("Compilation failed.");
              return 1;
          }

          var context = environment.CreateEvaluationContextBuilder()
              .Set(flag, CelValue.Bool(true))
              .Build();

          var result = compilation.Program!.Evaluate(context);
          if (!result.IsSuccess || result.AsBool() != true)
          {
              Console.Error.WriteLine("Evaluation did not produce the expected result.");
              return 1;
          }

          Console.WriteLine("ArchLinterNet.CEL external consumer smoke test passed.");
          return 0;
          CSEOF

          dotnet add package ArchLinterNet.CEL --version "$cel_version"
          dotnet run

          popd >/dev/null
