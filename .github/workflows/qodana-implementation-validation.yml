name: Qodana implementation validation

on:
  push:
    branches:
      - feat/864-qodana-community-advisory
    paths:
      - .github/workflows/qodana-implementation-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Test runner contracts
        run: python3 -m unittest discover -s tests/qodana -v

      - name: Test full Python tooling coverage
        run: make test-tooling-coverage

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          shellcheck: false
          pyflakes: false
          cache: true
          fail-on-error: true

      - name: Lint workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          advanced-security: false
          annotations: false
          min-severity: low
          inputs: .github/workflows

      - name: Check changed workflow and documentation formatting
        if: always()
        run: |
          npx --yes --ignore-scripts prettier@3.9.5 --check .github/workflows/qodana*.yml qodana.yaml
          uv run --frozen --project tools/pyproject.toml mdformat --check docs/internal/qodana-community-adoption.md
          git diff --check

      - name: Validate OpenSpec
        if: always()
        env:
          OPENSPEC_TELEMETRY: "0"
        run: |
          npx --yes --ignore-scripts --package=@fission-ai/openspec@1.13.0 -- openspec validate --all

      - name: Collect final validation evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/qodana-validation"
          git rev-parse HEAD > "$RUNNER_TEMP/qodana-validation/validated-sha.txt"
          git archive --format=tar HEAD tools/scripts/qodana_ci.py tests/qodana make/lint.mk qodana.yaml .github/workflows/qodana.yml docs/internal/qodana-community-adoption.md openspec/changes/add-qodana-community-ci > "$RUNNER_TEMP/qodana-validation/qodana-sources.tar"
          if [[ -f coverage-python.xml ]]; then
            cp coverage-python.xml "$RUNNER_TEMP/qodana-validation/"
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qodana-implementation-validation
          path: ${{ runner.temp }}/qodana-validation
          if-no-files-found: error
          retention-days: 7
