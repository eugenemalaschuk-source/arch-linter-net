  packed_artifact_windows_tests:
    name: Packed Artifact Test Suite (Windows)
    needs: [packed_artifact_candidate, packed_artifact_windows_shards]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Require successful candidate and Windows scenario shards
        if: needs.packed_artifact_candidate.result != 'success' || needs.packed_artifact_windows_shards.result != 'success'
        run: |
          echo "candidate: ${{ needs.packed_artifact_candidate.result }}" >&2
          echo "Windows packed-artifact shards: ${{ needs.packed_artifact_windows_shards.result }}" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: checkpoint-b-pr-candidate
          path: artifacts/candidate

      - name: Download Windows shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: checkpoint-b-pr-windows-x64-*
          path: artifacts/checkpoint-b-shards

      - name: Merge and validate complete platform evidence
        run: |
          python3 tools/release/merge_checkpoint_b_platform_evidence.py \
            --input-dir artifacts/checkpoint-b-shards \
            --candidate-manifest artifacts/candidate/package-manifest.json \
            --output artifacts/checkpoint-b-platform/checkpoint-b-platform-evidence.json

      - name: Upload canonical Windows platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkpoint-b-pr-platform-windows-x64
          path: artifacts/checkpoint-b-platform
          if-no-files-found: error
          retention-days: 1

