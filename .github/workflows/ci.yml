name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'eugenemalaschuk-source_arch-linter-net' }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'eugenemalaschuk-source' }}

jobs:
  # Pull-request validation is decomposed along real dependency boundaries. Workflow quality,
  # repository lint, architecture coverage, tooling/support tests, cross-platform correctness and
  # the .NET coverage shards all start independently. Coverage + Sonar is the one intentional
  # fan-in: it waits for the isolated coverage shards because it consumes their report artifacts.
  workflow_quality:
    name: Workflow Quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # actionlint, zizmor, and the workflow Prettier check only — no .NET restore, so this fails
    # fast independently of every other pull-request validation job.
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          shellcheck: false
          pyflakes: false
          cache: true
          fail-on-error: true

      - name: Lint workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          advanced-security: false
          annotations: false
          min-severity: low
          inputs: .github/workflows

      - name: Check workflow formatting
        run: npx --yes --ignore-scripts prettier@3.9.5 --check ".github/workflows/*.yml"

  repository_lint:
    name: Repository Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Keep fast repository hygiene separate from the single architecture-analysis owner below.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Lint
        run: make lint-code-size lint-docs lint-dotnet-format lint-test-shard-membership

  dotnet_coverage:
    name: .NET Coverage (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core-1
            name: Core Shard 1
            target: test-coverage-core-1
          - id: core-2
            name: Core Shard 2
            target: test-coverage-core-2
          - id: other
            name: CEL + CLI
            target: test-coverage-other
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Collect ${{ matrix.name }} coverage
        shell: bash
        run: make ${{ matrix.target }}

      - name: Upload .NET coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dotnet-coverage-${{ matrix.id }}
          path: test-results/coverage
          if-no-files-found: error

  coverage_sonar:
    name: Coverage + Sonar
    needs: dotnet_coverage
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TRUSTED_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}

    steps:
      - name: Require successful .NET coverage shards
        if: needs.dotnet_coverage.result != 'success'
        run: |
          echo ".NET coverage shard matrix result: ${{ needs.dotnet_coverage.result }}" >&2
          echo "Coverage + Sonar requires every coverage shard to succeed; refusing a partial aggregate." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download .NET coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dotnet-coverage-*
          path: test-results/coverage-shards

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Setup Node.js for badge relay coverage
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Collect badge relay coverage
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix relay
          npm run test:coverage --prefix relay
          test -s relay/coverage/lcov.info

      - name: Cache SonarQube packages
        if: env.TRUSTED_PR == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        if: env.TRUSTED_PR == 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Validate SonarCloud configuration
        if: env.TRUSTED_PR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          missing=()
          [[ -n "$SONAR_TOKEN" ]] || missing+=("SONAR_TOKEN secret")
          [[ -n "$SONAR_PROJECT_KEY" ]] || missing+=("SONAR_PROJECT_KEY repository variable or committed default")
          [[ -n "$SONAR_ORGANIZATION" ]] || missing+=("SONAR_ORGANIZATION repository variable or committed default")

          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing SonarCloud configuration: %s\n' "${missing[*]}" >&2
            echo "Configure GitHub secret SONAR_TOKEN and, if overriding defaults, repository variables SONAR_PROJECT_KEY / SONAR_ORGANIZATION." >&2
            exit 1
          fi

      - name: Begin SonarCloud analysis
        id: sonar_begin
        if: env.TRUSTED_PR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.cs.opencover.reportsPaths="test-results/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="test-results/**/*.trx" \
            /d:sonar.python.coverage.reportPaths="coverage-python.xml" \
            /d:sonar.javascript.lcov.reportPaths="relay/coverage/lcov.info" \
            /d:sonar.exclusions="**/AdoptionAcceptance/Fixtures/**" \
            /d:sonar.coverage.exclusions="tools/ArchLinterNet.GitFuzz/**,tools/ArchLinterNet.ProcessTreeProbe/**,tools/**/tests/**,tests/qodana/**,tools/badge_promotion/cli.py,tools/badge_promotion/contracts.py,**/CheckpointBReleaseGateTests*.cs"

      - name: Build for SonarCloud analysis
        if: env.TRUSTED_PR == 'true'
        run: dotnet build ArchLinterNet.slnx --no-restore --nologo

      - name: Collect Python tooling coverage
        run: make test-tooling-coverage

      - name: Resolve coverage report paths
        id: coverage_reports
        shell: bash
        run: |
          files="$(find test-results -name 'coverage.cobertura.xml' -print | sed 's#^#./#' | paste -sd, -)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No .NET Cobertura coverage reports were downloaded." >&2
            exit 1
          fi

      - name: Upload test coverage to Codecov
        if: steps.coverage_reports.outputs.files != '' && env.TRUSTED_PR == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

      - name: End SonarCloud analysis
        id: sonar_end
        if: success() && steps.sonar_begin.outcome == 'success'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publish SonarCloud PR summary link
        if: always() && env.TRUSTED_PR == 'true'
        shell: bash
        run: |
          {
            echo "### SonarCloud PR analysis"
            echo
            echo "- Scanner completion: ${{ steps.sonar_end.outcome || 'skipped' }}"
            echo "- Coverage reports: ${{ steps.coverage_reports.outputs.files != '' && 'found' || 'not found' }}"
            echo "- Quality gate check: review the Sonar-created GitHub status/check on this pull request."
            echo "- SonarCloud PR analysis: [Open SonarCloud PR report](https://sonarcloud.io/summary/new_code?id=${SONAR_PROJECT_KEY}&pullRequest=${{ github.event.pull_request.number }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain secret-backed integration skip
        if: always() && env.TRUSTED_PR != 'true'
        shell: bash
        run: |
          {
            echo "### Secret-backed integrations"
            echo
            echo "SonarCloud and Codecov uploads were skipped because GitHub does not expose ordinary repository secrets to fork or Dependabot pull requests."
            echo ".NET coverage shards still ran and their reports were aggregated without those secrets."
          } >> "$GITHUB_STEP_SUMMARY"

  architecture_pr_report_producer:
    name: Architecture Coverage
    runs-on: ubuntu-latest
    # This builds the head, materializes a base snapshot, then emits health/change/report artifacts.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ARCHITECTURE_REPORT_DIRECTORY: architecture-pr-report
      ARCHITECTURE_REPORT_ARTIFACT_DIRECTORY: architecture-pr-report-artifact
      ARCHITECTURE_HEALTH_BADGE_ARTIFACT_DIRECTORY: architecture-health-badge-artifact
      ARCHITECTURE_CANDIDATE_MANIFEST: architecture-pr-report/architecture-candidate.json
    outputs:
      strict_coverage_outcome: ${{ steps.architecture_projections.outputs.coverage_outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Build one architecture candidate
        id: architecture_candidate
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$candidate_sha" = "$EXPECTED_HEAD_SHA"
          candidate_start_ms="$(date +%s%3N)"
          build_proof_nonce="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          dotnet build ArchLinterNet.slnx --nologo --no-restore -m:1 \
            -p:ArchLinterNetBuildProofNonce="$build_proof_nonce"
          dotnet run --no-build --project src/ArchLinterNet.Cli/ArchLinterNet.Cli.csproj -- \
            --policy architecture/dependencies.arch.yml \
            --no-restore \
            --publish-prepared-receipts \
            --build-proof-nonce "$build_proof_nonce"
          candidate_end_ms="$(date +%s%3N)"
          echo "candidate_start_ms=$candidate_start_ms" >> "$GITHUB_OUTPUT"
          echo "candidate_end_ms=$candidate_end_ms" >> "$GITHUB_OUTPUT"
          cli_assembly="$GITHUB_WORKSPACE/src/ArchLinterNet.Cli/bin/Debug/net10.0/ArchLinterNet.Cli.dll"
          testing_assembly="$GITHUB_WORKSPACE/src/ArchLinterNet.Testing/bin/Debug/net10.0/ArchLinterNet.Testing.dll"
          test -s "$cli_assembly"
          test -s "$testing_assembly"
          python3 tools/scripts/architecture_candidate.py create \
            --repository-root "$GITHUB_WORKSPACE" \
            --source-sha "$candidate_sha" \
            --policy architecture/dependencies.arch.yml \
            --cli-assembly "$cli_assembly" \
            --testing-assembly "$testing_assembly" \
            --output "$ARCHITECTURE_CANDIDATE_MANIFEST"
          python3 tools/scripts/architecture_candidate.py verify \
            --repository-root "$GITHUB_WORKSPACE" \
            --manifest "$ARCHITECTURE_CANDIDATE_MANIFEST"
          cli_identity="$(python3 - "$ARCHITECTURE_CANDIDATE_MANIFEST" <<'PY'
          import json
          import sys
          from pathlib import Path

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(document["cli_assembly_sha256"])
          PY
          )"
          {
            echo "ARCHITECTURE_CANDIDATE_SOURCE_SHA=$candidate_sha"
            echo "ARCHITECTURE_CANDIDATE_TREE_SHA=$candidate_tree_sha"
            echo "ARCHITECTURE_CANDIDATE_TOOL_SHA256=$cli_identity"
          } >> "$GITHUB_ENV"

      - name: Collect changed first-party files
        if: github.event_name == 'pull_request'
        id: changed_files
        continue-on-error: true
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git diff --name-only --diff-filter=ACMR "origin/$PR_BASE_REF"...HEAD \
            -- '*.cs' ':!*.g.cs' ':!*Designer.cs' > changed-files.txt

      - name: Create architecture report base worktree
        id: architecture_report_base
        if: always()
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_WORKTREE: ${{ runner.temp }}/archlinter-base-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          mkdir -p "$ARCHITECTURE_REPORT_DIRECTORY"
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          echo "path=$BASE_WORKTREE" >> "$GITHUB_OUTPUT"

      - name: Prepare architecture report base
        id: architecture_report_base_preparation
        if: steps.architecture_report_base.outcome == 'success'
        env:
          BASE_WORKTREE: ${{ steps.architecture_report_base.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          base_start_ms="$(date +%s%3N)"
          dotnet restore "$BASE_WORKTREE/ArchLinterNet.slnx" --nologo -m:1 --disable-parallel
          # The detached base predates the proof target. Copy only this inert build-provenance
          # target into the temporary worktree so the baseline gets the same proof contract.
          cp "$GITHUB_WORKSPACE/Directory.Build.targets" "$BASE_WORKTREE/Directory.Build.targets"
          build_proof_nonce="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          dotnet build "$BASE_WORKTREE/ArchLinterNet.slnx" --nologo --no-restore -m:1 \
            -p:ArchLinterNetBuildProofNonce="$build_proof_nonce"
          pushd "$BASE_WORKTREE"
          dotnet run --no-build --project "$GITHUB_WORKSPACE/src/ArchLinterNet.Cli/ArchLinterNet.Cli.csproj" -- \
            --policy architecture/dependencies.arch.yml \
            --no-restore \
            --publish-prepared-receipts \
            --build-proof-nonce "$build_proof_nonce"
          popd
          base_end_ms="$(date +%s%3N)"
          echo "start_ms=$base_start_ms" >> "$GITHUB_OUTPUT"
          echo "end_ms=$base_end_ms" >> "$GITHUB_OUTPUT"

      - name: Run independent architecture projections
        id: architecture_projections
        if: always() && steps.architecture_candidate.outcome == 'success' && steps.architecture_report_base.outcome == 'success' && steps.architecture_report_base_preparation.outcome == 'success'
        continue-on-error: true
        env:
          BASE_WORKTREE: ${{ steps.architecture_report_base.outputs.path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXECUTION_CONTEXT: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_START_MS: ${{ steps.architecture_candidate.outputs.candidate_start_ms }}
          CANDIDATE_END_MS: ${{ steps.architecture_candidate.outputs.candidate_end_ms }}
          BASE_PREPARATION_START_MS: ${{ steps.architecture_report_base_preparation.outputs.start_ms }}
          BASE_PREPARATION_END_MS: ${{ steps.architecture_report_base_preparation.outputs.end_ms }}
          REPORT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          REPORT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        shell: bash
        run: |
          set +e
          output_directory="$GITHUB_WORKSPACE/$ARCHITECTURE_REPORT_DIRECTORY"
          projection_directory="$RUNNER_TEMP/arch-linter-net-projections-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$output_directory" "$projection_directory"
          cli_project="$GITHUB_WORKSPACE/src/ArchLinterNet.Cli/ArchLinterNet.Cli.csproj"

          run_projection() {
            local name="$1"
            shift
            local start end exit_code
            start="$(date +%s%3N)"
            "$@" > "$projection_directory/$name.log" 2>&1
            exit_code=$?
            end="$(date +%s%3N)"
            printf '%s|%s|%s|%s\n' "$name" "$start" "$end" "$exit_code" > "$projection_directory/$name.status"
            return 0
          }

          verify_candidate() {
            python3 tools/scripts/architecture_candidate.py verify \
              --repository-root "$GITHUB_WORKSPACE" \
              --manifest "$ARCHITECTURE_CANDIDATE_MANIFEST"
          }

          run_strict() {
            verify_candidate
            make lint-architecture ARCHITECTURE_BUILD_ALREADY_PREPARED=true
          }

          run_public_api() {
            verify_candidate
            make public-api-check ARCHITECTURE_BUILD_ALREADY_PREPARED=true
          }

          run_coverage() {
            verify_candidate
            DIFF_STATUS="ok"
            if [ "${{ steps.changed_files.outcome }}" = "failure" ]; then
              DIFF_STATUS="failed"
            fi
            make architecture-coverage-ci ARCHITECTURE_BUILD_ALREADY_PREPARED=true DIFF_STATUS="$DIFF_STATUS"
          }

          run_report_inputs() {
            verify_candidate
            snapshot() {
              local snapshot_output="$1"
              local snapshot_args=(
                --policy architecture/dependencies.arch.yml
                --mode strict
                --use-prepared-receipts
              )
              if [[ -f architecture/baseline.arch.yml ]]; then
                snapshot_args+=(--baseline architecture/baseline.arch.yml)
              fi
              dotnet run --no-build --project "$cli_project" -- change snapshot \
                "${snapshot_args[@]}" \
                --output "$snapshot_output"
            }

            base_start="$(date +%s%3N)"
            pushd "$BASE_WORKTREE"
            snapshot "$output_directory/base-architecture-change-snapshot.json"
            base_exit=$?
            popd
            base_end="$(date +%s%3N)"
            printf '%s|%s|%s|%s\n' base "$base_start" "$base_end" "$base_exit" > "$projection_directory/base.status"
            [ "$base_exit" -eq 0 ] || return "$base_exit"

            health_args=(
              --policy architecture/dependencies.arch.yml
              --mode strict
              --use-prepared-receipts
            )
            if [[ -f architecture/baseline.arch.yml ]]; then
              health_args+=(--baseline architecture/baseline.arch.yml)
            else
              empty_baseline="$RUNNER_TEMP/arch-linter-net-empty-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.arch.yml"
              printf '%s\n' 'version: 3' 'baseline: {}' 'metric_baselines: []' > "$empty_baseline"
              health_args+=(--baseline "$empty_baseline")
            fi
            dotnet run --no-build --project "$cli_project" -- health \
              "${health_args[@]}" \
              --format json \
              --execution-context "$EXECUTION_CONTEXT" \
              --change-snapshot "$output_directory/current-architecture-change-snapshot.json" \
              > "$output_directory/architecture-health.json"
            health_exit=$?
            if [ "$health_exit" -ne 0 ] && [ ! -s "$output_directory/architecture-health.json" ]; then
              return "$health_exit"
            fi
            if ! python3 - "$output_directory/architecture-health.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Architecture Health output is not valid JSON: {error}")

          if not isinstance(document, dict) or document.get("schema_id") != "architecture-health/v1":
              raise SystemExit("Architecture Health output must use schema_id architecture-health/v1.")
          PY
            then
              return 2
            fi

            dotnet run --no-build --project "$cli_project" -- badge architecture-health \
              --input "$output_directory/architecture-health.json" \
              --output "$output_directory/architecture-health-badge.json"
            badge_exit=$?
            if [ "$badge_exit" -ne 0 ] && [ ! -s "$output_directory/architecture-health-badge.json" ]; then
              return "$badge_exit"
            fi
            if ! python3 - "$output_directory/architecture-health-badge.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Architecture Health badge output is not valid JSON: {error}")

          if (not isinstance(document, dict)
                  or set(document) != {"schemaVersion", "label", "message", "color"}
                  or document.get("schemaVersion") != 1
                  or document.get("label") != "architecture"
                  or not all(isinstance(document.get(key), str) and document[key] for key in ("message", "color"))):
              raise SystemExit("Architecture Health badge output must be a complete Shields endpoint document.")
          PY
            then
              return 2
            fi

            dotnet run --no-build --project "$cli_project" -- change report \
              --base "$output_directory/base-architecture-change-snapshot.json" \
              --current "$output_directory/current-architecture-change-snapshot.json" \
              --execution-context "$EXECUTION_CONTEXT" \
              --format json \
              --output "$output_directory/architecture-change.json"
            report_exit=$?
            [ "$report_exit" -eq 0 ] || return "$report_exit"

            dotnet run --no-build --project "$cli_project" -- report pr \
              --health "$output_directory/architecture-health.json" \
              --change "$output_directory/architecture-change.json" \
              --output "$output_directory/architecture-pr-report.md" \
              --max-details 20 \
              --repository-url "$REPORT_REPOSITORY_URL" \
              --head-sha "$REPORT_HEAD_SHA" \
              --artifact-url "$REPORT_ARTIFACT_URL"
          }

          run_projection strict run_strict &
          strict_pid=$!
          run_projection public_api run_public_api &
          public_api_pid=$!
          run_projection coverage run_coverage &
          coverage_pid=$!
          run_projection report_inputs run_report_inputs &
          report_pid=$!
          wait "$strict_pid" "$public_api_pid" "$coverage_pid" "$report_pid"

          python3 - "$ARCHITECTURE_CANDIDATE_MANIFEST" "$projection_directory" "$output_directory/architecture-dag-evidence.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          projection_directory = Path(sys.argv[2])
          output_path = Path(sys.argv[3])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          projections = []
          for status_path in sorted(projection_directory.glob("*.status")):
              name, start, end, exit_code = status_path.read_text(encoding="utf-8").strip().split("|")
              projections.append({
                  "id": name,
                  "start_epoch_ms": int(start),
                  "end_epoch_ms": int(end),
                  "duration_ms": int(end) - int(start),
                  "exit_code": int(exit_code),
                  "outcome": "success" if int(exit_code) == 0 else "failure",
              })
          all_projection_starts = [item["start_epoch_ms"] for item in projections]
          all_projection_ends = [item["end_epoch_ms"] for item in projections]
          candidate_preparation = {
              "start_epoch_ms": int(os.environ["CANDIDATE_START_MS"]),
              "end_epoch_ms": int(os.environ["CANDIDATE_END_MS"]),
          }
          candidate_preparation["duration_ms"] = (
              candidate_preparation["end_epoch_ms"] - candidate_preparation["start_epoch_ms"]
          )
          base_preparation = {
              "start_epoch_ms": int(os.environ["BASE_PREPARATION_START_MS"]),
              "end_epoch_ms": int(os.environ["BASE_PREPARATION_END_MS"]),
          }
          base_preparation["duration_ms"] = base_preparation["end_epoch_ms"] - base_preparation["start_epoch_ms"]
          governance_span_ms = (
              max(all_projection_ends) - min(candidate_preparation["start_epoch_ms"], base_preparation["start_epoch_ms"])
              if projections else None
          )
          command_sum_ms = sum(item["duration_ms"] for item in projections)
          evidence = {
              "schema": "architecture-ci-dag/v1",
              "candidate": manifest,
              "context": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "pull_request_number": os.environ["PR_NUMBER"],
                  "head_sha": os.environ["REPORT_HEAD_SHA"],
                  "base_sha": os.environ["BASE_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "runner_image": os.environ.get("ImageOS", "ubuntu-latest"),
              },
              "dependencies": {
                  "candidate_preparation": ["restore", "source/tree/tool identity"],
                  "base_preparation": ["base-reference", "source/tree/tool identity"],
                  "strict": ["candidate_preparation"],
                  "public_api": ["candidate_preparation"],
                  "coverage": ["candidate_preparation", "changed-files"],
                  "report_inputs": ["candidate_preparation", "base_preparation", "changed-files"],
                  "rendering": ["health", "change", "report inputs"],
              },
              "projections": projections,
              "command_accounting": {
                  "candidate_preparation": {
                      "restore_processes": 1,
                      "build_processes": 1,
                      "receipt_publication_processes": 1,
                      "candidate_verification_processes": 1,
                  },
                  "base_preparation": {
                      "restore_processes": 1,
                      "build_processes": 1,
                      "receipt_publication_processes": 1,
                  },
                  "strict": {"projection_processes": 1, "cli_processes": 1},
                  "public_api": {"projection_processes": 1, "cli_processes": 3},
                  "coverage": {"projection_processes": 1, "cli_processes": 7},
                  "report_inputs": {"projection_processes": 1, "cli_processes": 5},
              },
              "governance_span_ms": governance_span_ms,
              "candidate_preparation": candidate_preparation,
              "base_preparation": base_preparation,
              "projection_command_sum_ms": command_sum_ms,
              "comparison": {
                  "before_median_seconds": 204,
                  "target_median_seconds": 60,
                  "status": "PASS" if governance_span_ms is not None and governance_span_ms <= 60_000 else "GAP",
              },
          }
          output_path.write_text(json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

          for log_path in "$projection_directory"/*.log; do
            [ -f "$log_path" ] || continue
            printf '\n%s\n' "$(basename "$log_path")"
            cat "$log_path"
          done

          python3 - "$projection_directory" "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path

          outputs = {}
          for status_path in Path(sys.argv[1]).glob("*.status"):
              name, _, _, exit_code = status_path.read_text(encoding="utf-8").strip().split("|")
              outputs[f"{name}_outcome"] = "success" if int(exit_code) == 0 else "failure"
          with Path(sys.argv[2]).open("a", encoding="utf-8") as stream:
              for name, value in sorted(outputs.items()):
                  stream.write(f"{name}={value}\n")
          PY

      - name: Upload candidate identity
        if: always() && steps.architecture_candidate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-candidate-v1
          path: ${{ env.ARCHITECTURE_CANDIDATE_MANIFEST }}

      - name: Upload architecture DAG evidence
        if: always() && hashFiles('architecture-pr-report/architecture-dag-evidence.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-ci-dag-v1
          path: architecture-pr-report/architecture-dag-evidence.json

      - name: Verify reviewed unavailable Architecture Health badge receipt
        id: architecture_health_badge_unavailable
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          reviewed_payload="$GITHUB_WORKSPACE/architecture/architecture-health-badge-unavailable.json"
          generated_payload="$RUNNER_TEMP/architecture-health-badge-unavailable.json"
          set +e
          dotnet run --no-build --project src/ArchLinterNet.Cli/ArchLinterNet.Cli.csproj -- \
            badge architecture-health \
            --input "$RUNNER_TEMP/missing-architecture-health.json" \
            --output "$generated_payload"
          fallback_exit=$?
          set -e
          if [ "$fallback_exit" -ne 2 ] || [ ! -s "$generated_payload" ]; then
            exit 1
          fi
          cmp --silent "$reviewed_payload" "$generated_payload"

      - name: Create bound architecture PR report manifest
        id: architecture_report_manifest
        if: always() && steps.architecture_projections.outputs.report_inputs_outcome == 'success'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          report_path="$ARCHITECTURE_REPORT_DIRECTORY/architecture-pr-report.md"
          artifact_directory="$ARCHITECTURE_REPORT_ARTIFACT_DIRECTORY"
          mkdir -p "$artifact_directory"
          cp "$report_path" "$artifact_directory/architecture-pr-report.md"
          export report_path="$artifact_directory/architecture-pr-report.md"
          export manifest_path="$artifact_directory/architecture-pr-report.manifest.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["report_path"])
          report_bytes = report_path.read_bytes()
          manifest = {
              "schema": "architecture-pr-report-publication/v1",
              "kind": "architecture-pr-report",
              "marker": "arch-linter-net-pr-report:v1",
              "context": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "pr_number": os.environ["PR_NUMBER"],
                  "head_sha": os.environ["PR_HEAD_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
              "report": {
                  "path": "architecture-pr-report.md",
                  "bytes": len(report_bytes),
                  "sha256": hashlib.sha256(report_bytes).hexdigest(),
              },
          }
          Path(os.environ["manifest_path"]).write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create bound Architecture Health badge manifest
        id: architecture_health_badge_manifest
        if: always() && steps.architecture_projections.outputs.report_inputs_outcome == 'success'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          payload_path="$ARCHITECTURE_REPORT_DIRECTORY/architecture-health-badge.json"
          artifact_directory="$ARCHITECTURE_HEALTH_BADGE_ARTIFACT_DIRECTORY"
          mkdir -p "$artifact_directory"
          cp "$payload_path" "$artifact_directory/architecture-health-badge.json"
          export payload_path="$artifact_directory/architecture-health-badge.json"
          export manifest_path="$artifact_directory/architecture-health-badge.manifest.json"
          PR_HEAD_TREE_SHA="$(git rev-parse "$PR_HEAD_SHA^{tree}")"
          export PR_HEAD_TREE_SHA
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          payload_path = Path(os.environ["payload_path"])
          payload_bytes = payload_path.read_bytes()
          manifest = {
              "schema": "architecture-health-badge-promotion/v1",
              "kind": "architecture-health-badge",
              "context": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "pr_number": os.environ["PR_NUMBER"],
                  "base_ref": os.environ["PR_BASE_REF"],
                  "base_sha": os.environ["PR_BASE_SHA"],
                  "head_sha": os.environ["PR_HEAD_SHA"],
                  "head_tree_sha": os.environ["PR_HEAD_TREE_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
              "payload": {
                  "path": "architecture-health-badge.json",
                  "bytes": len(payload_bytes),
                  "sha256": hashlib.sha256(payload_bytes).hexdigest(),
              },
          }
          Path(os.environ["manifest_path"]).write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload strict diagnostics
        if: always() && hashFiles('architecture-strict.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-strict
          path: architecture-strict.json

      - name: Upload audit diagnostics
        if: always() && hashFiles('architecture-audit.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-audit
          path: architecture-audit.json

      - name: Upload architecture coverage report
        if: always() && hashFiles('architecture-coverage.md') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-coverage-report
          path: architecture-coverage.md

      - name: Upload architecture Health artifact
        if: always() && hashFiles('architecture-pr-report/architecture-health.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-health
          path: architecture-pr-report/architecture-health.json

      - name: Upload architecture change artifact
        if: always() && hashFiles('architecture-pr-report/architecture-change.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-change
          path: architecture-pr-report/architecture-change.json

      - name: Upload bound architecture PR report
        if: always() && hashFiles('architecture-pr-report-artifact/architecture-pr-report.md') != '' && hashFiles('architecture-pr-report-artifact/architecture-pr-report.manifest.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-pr-report-v1
          path: |
            architecture-pr-report-artifact/architecture-pr-report.md
            architecture-pr-report-artifact/architecture-pr-report.manifest.json
          if-no-files-found: error

      - name: Upload bound Architecture Health badge
        if: always() && hashFiles('architecture-health-badge-artifact/architecture-health-badge.json') != '' && hashFiles('architecture-health-badge-artifact/architecture-health-badge.manifest.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-health-badge-v1
          path: |
            architecture-health-badge-artifact/architecture-health-badge.json
            architecture-health-badge-artifact/architecture-health-badge.manifest.json
          if-no-files-found: error

      - name: Remove architecture report base worktree
        if: always() && steps.architecture_report_base.outcome == 'success'
        env:
          BASE_WORKTREE: ${{ steps.architecture_report_base.outputs.path }}
        shell: bash
        run: git worktree remove --force "$BASE_WORKTREE"

      - name: Fail if architecture PR report inputs are unavailable
        if: always() && steps.architecture_projections.outputs.report_inputs_outcome != 'success'
        run: exit 1

      - name: Fail if reviewed public API verification is unavailable
        if: always() && steps.architecture_projections.outputs.public_api_outcome != 'success'
        run: exit 1

      - name: Fail if architecture PR report manifest is unavailable
        if: always() && steps.architecture_report_manifest.outcome != 'success'
        run: exit 1

      - name: Fail if Architecture Health badge manifest is unavailable
        if: always() && steps.architecture_health_badge_manifest.outcome != 'success'
        run: exit 1

      - name: Fail if reviewed unavailable Architecture Health badge receipt is unavailable
        if: always() && steps.architecture_health_badge_unavailable.outcome != 'success'
        run: exit 1

  architecture_pr_report_gate:
    name: Architecture PR Report Gate
    needs: architecture_pr_report_producer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - name: Fail if architecture report producer is unavailable
        if: needs.architecture_pr_report_producer.result != 'success'
        run: exit 1

      - name: Fail if strict architecture coverage failed
        if: needs.architecture_pr_report_producer.outputs.strict_coverage_outcome == 'failure'
        run: exit 1

  tooling_support_tests:
    name: Tooling / Support Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Test packed-artifact release-evidence aggregator
        run: make test-release-evidence

      - name: Test release version-calculation script
        run: make test-calculate-version

      - name: Test test-coverage badge Markdown generator
        run: make test-coverage-badge-script

  unit_tests:
    name: Unit Test Suite (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows / Core Shard 1
            shard: 1
          - os: windows-latest
            name: Windows / Core Shard 2
            shard: 2
          - os: macos-14
            name: Apple Silicon macOS / Core Shard 1
            shard: 1
          - os: macos-14
            name: Apple Silicon macOS / Core Shard 2
            shard: 2
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon macOS runner
        if: matrix.os == 'macos-14'
        run: test "$(uname -m)" = arm64

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: make restore

      - name: Run Core unit shard ${{ matrix.shard }}
        shell: bash
        run: make test-unit-core-${{ matrix.shard }}

      - name: Run non-Core unit assemblies (CEL.Tests, Cli.Tests)
        if: matrix.shard == 1
        shell: bash
        run: make test-unit-other

  e2e_tests:
    name: E2E Test Suite (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: Apple Silicon macOS
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon macOS runner
        if: matrix.os == 'macos-14'
        run: test "$(uname -m)" = arm64

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: make restore

      - name: Run E2E test suite
        shell: bash
        run: make test-e2e

  packed_artifact_candidate:
    name: Packed Artifact Candidate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ARCH_LINTER_SOURCE_SHA: ${{ github.sha }}
      CHECKPOINT_B_CANDIDATE_VERSION: 0.6.1-ci.${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Prepare ephemeral immutable Checkpoint B candidate
        shell: bash
        run: make prepare-packed-artifact-candidate

      - name: Verify candidate manifest
        shell: bash
        run: python3 tools/release/package_manifest.py verify --packages-dir artifacts/checkpoint-b-candidate --manifest artifacts/checkpoint-b-candidate/package-manifest.json --version "$CHECKPOINT_B_CANDIDATE_VERSION" --source-commit "$ARCH_LINTER_SOURCE_SHA"

      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkpoint-b-pr-candidate
          path: artifacts/checkpoint-b-candidate
          if-no-files-found: error
          retention-days: 1

  packed_artifact_windows_shards:
    name: Packed Artifact Shard (${{ matrix.name }} / ${{ matrix.shard_name }})
    needs: packed_artifact_candidate
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            platform: windows-x64
            shell_adapter: pwsh
            shard: package-and-entrypoints
            shard_name: Package + entrypoints
            target: test-packed-artifact-package-and-entrypoints
          - os: windows-latest
            name: Windows
            platform: windows-x64
            shell_adapter: pwsh
            shard: ensure-built-replaces-testing-output
            shard_name: Ensure-built replaces Testing output
            target: test-packed-artifact-ensure-built-replaces-testing-output
          - os: windows-latest
            name: Windows
            platform: windows-x64
            shell_adapter: pwsh
            shard: adopter-runtime-core
            shard_name: Adopter runtime core
            target: test-packed-artifact-adopter-runtime-core
          - os: windows-latest
            name: Windows
            platform: windows-x64
            shell_adapter: pwsh
            shard: adopter-runtime-extended
            shard_name: Adopter runtime extended
            target: test-packed-artifact-adopter-runtime-extended
          - os: windows-latest
            name: Windows
            platform: windows-x64
            shell_adapter: pwsh
            shard: consumer-cleanup-policy-execution
            shard_name: Consumer cleanup policy execution
            target: test-packed-artifact-consumer-cleanup-policy-execution
          - os: windows-latest
            name: Windows
            platform: windows-x64
            shell_adapter: pwsh
            shard: consumer-cleanup-dependency-contract-id-parity
            shard_name: Consumer cleanup dependency-contract id parity
            target: test-packed-artifact-consumer-cleanup-dependency-contract-id-parity
          - os: windows-latest
            name: Windows
            platform: windows-x64
            shell_adapter: pwsh
            shard: consumer-cleanup-layer-overlap-and-policy-shape
            shard_name: Consumer cleanup layer overlap + policy shape
            target: test-packed-artifact-consumer-cleanup-layer-overlap-and-policy-shape
          - os: windows-latest
            name: Windows
            platform: windows-x64
            shell_adapter: pwsh
            shard: consumer-cleanup-configuration-and-identity
            shard_name: Consumer cleanup configuration + identity
            target: test-packed-artifact-consumer-cleanup-configuration-and-identity
          - os: windows-latest
            name: Windows
            platform: windows-x64
            shell_adapter: pwsh
            shard: consumer-cleanup-source-set-authoring
            shard_name: Consumer cleanup source-set authoring
            target: test-packed-artifact-consumer-cleanup-source-set-authoring
          - os: windows-latest
            name: Windows
            platform: windows-x64
            shell_adapter: pwsh
            shard: public-api-surface-selector-snapshot-and-role
            shard_name: Public API selector snapshot + role
