name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'eugenemalaschuk-source_arch-linter-net' }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'eugenemalaschuk-source' }}

jobs:
  # Pull-request validation is decomposed along real dependency boundaries. Workflow quality,
  # repository lint, architecture coverage, tooling/support tests, cross-platform correctness and
  # the .NET coverage shards all start independently. Coverage + Sonar is the one intentional
  # fan-in: it waits for the isolated coverage shards because it consumes their report artifacts.
  workflow_quality:
    name: Workflow Quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # actionlint, zizmor, and the workflow Prettier check only — no .NET restore, so this fails
    # fast independently of every other pull-request validation job.
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          shellcheck: false
          pyflakes: false
          cache: true
          fail-on-error: true

      - name: Lint workflows with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054
        with:
          advanced-security: false
          annotations: false
          min-severity: low
          inputs: .github/workflows

      - name: Check workflow formatting
        run: npx --yes --ignore-scripts prettier@3.9.5 --check ".github/workflows/*.yml"

  repository_lint:
    name: Repository Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # `make lint` (code size, dotnet format, self-architecture, docs) — not coupled to Sonar or
    # coverage collection.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Lint
        run: make lint

  dotnet_coverage:
    name: .NET Coverage (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Coverlet rewrites instrumented assemblies on disk and restores them after each run. Core
    # coverage shards therefore run on separate runners/checkouts instead of concurrently against
    # one shared bin/obj tree. Their artifacts are merged downstream by Coverage + Sonar (PRs) or
    # Main Badge Refresh (main pushes). This spends runner-minutes to shorten wall-clock feedback.
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core-1
            name: Core Shard 1
            target: test-coverage-core-1
          - id: core-2
            name: Core Shard 2
            target: test-coverage-core-2
          - id: other
            name: CEL + CLI
            target: test-coverage-other
    permissions:
      contents: read
    env:
      TEST_COVERAGE_DIAGNOSTICS: ${{ github.event_name == 'push' && '--blame-hang --blame-hang-timeout 5m' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Collect ${{ matrix.name }} coverage
        shell: bash
        run: make ${{ matrix.target }}

      - name: Upload .NET coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dotnet-coverage-${{ matrix.id }}
          path: test-results/coverage
          if-no-files-found: error

  coverage_sonar:
    name: Coverage + Sonar
    needs: dotnet_coverage
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The expensive .NET coverage execution already ran in isolated shard jobs. This aggregation
    # job downloads their reports, runs the Sonar-required build inside begin/end, collects Python
    # tooling coverage, uploads the same report union to Codecov, and waits for the quality gate.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TRUSTED_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}

    steps:
      - name: Require successful .NET coverage shards
        if: needs.dotnet_coverage.result != 'success'
        run: |
          echo ".NET coverage shard matrix result: ${{ needs.dotnet_coverage.result }}" >&2
          echo "Coverage + Sonar requires every coverage shard to succeed; refusing a partial aggregate." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download .NET coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dotnet-coverage-*
          path: test-results/coverage-shards

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Cache SonarQube packages
        if: env.TRUSTED_PR == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        if: env.TRUSTED_PR == 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Validate SonarCloud configuration
        if: env.TRUSTED_PR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          missing=()
          [[ -n "$SONAR_TOKEN" ]] || missing+=("SONAR_TOKEN secret")
          [[ -n "$SONAR_PROJECT_KEY" ]] || missing+=("SONAR_PROJECT_KEY repository variable or committed default")
          [[ -n "$SONAR_ORGANIZATION" ]] || missing+=("SONAR_ORGANIZATION repository variable or committed default")

          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing SonarCloud configuration: %s\n' "${missing[*]}" >&2
            echo "Configure GitHub secret SONAR_TOKEN and, if overriding defaults, repository variables SONAR_PROJECT_KEY / SONAR_ORGANIZATION." >&2
            exit 1
          fi

      - name: Begin SonarCloud analysis
        id: sonar_begin
        if: env.TRUSTED_PR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.cs.opencover.reportsPaths="test-results/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="test-results/**/*.trx" \
            /d:sonar.python.coverage.reportPaths="coverage-python.xml" \
            /d:sonar.exclusions="**/AdoptionAcceptance/Fixtures/**" \
            /d:sonar.coverage.exclusions="tools/**/tests/**,**/CheckpointBReleaseGateTests*.cs"

      - name: Build for SonarCloud analysis
        if: env.TRUSTED_PR == 'true'
        run: dotnet build ArchLinterNet.slnx --no-restore --nologo

      - name: Collect Python tooling coverage
        run: make test-tooling-coverage

      - name: Resolve coverage report paths
        id: coverage_reports
        shell: bash
        run: |
          files="$(find test-results -name 'coverage.cobertura.xml' -print | sed 's#^#./#' | paste -sd, -)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No .NET Cobertura coverage reports were downloaded." >&2
            exit 1
          fi

      - name: Upload test coverage to Codecov
        if: steps.coverage_reports.outputs.files != '' && env.TRUSTED_PR == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

      - name: End SonarCloud analysis
        id: sonar_end
        if: success() && steps.sonar_begin.outcome == 'success'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publish SonarCloud PR summary link
        if: always() && env.TRUSTED_PR == 'true'
        shell: bash
        run: |
          {
            echo "### SonarCloud PR analysis"
            echo
            echo "- Scanner completion: ${{ steps.sonar_end.outcome || 'skipped' }}"
            echo "- Coverage reports: ${{ steps.coverage_reports.outputs.files != '' && 'found' || 'not found' }}"
            echo "- Quality gate check: review the Sonar-created GitHub status/check on this pull request."
            echo "- SonarCloud PR analysis: [Open SonarCloud PR report](https://sonarcloud.io/summary/new_code?id=${SONAR_PROJECT_KEY}&pullRequest=${{ github.event.pull_request.number }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain secret-backed integration skip
        if: always() && env.TRUSTED_PR != 'true'
        shell: bash
        run: |
          {
            echo "### Secret-backed integrations"
            echo
            echo "SonarCloud and Codecov uploads were skipped because GitHub does not expose ordinary repository secrets to fork or Dependabot pull requests."
            echo ".NET coverage shards still ran and their reports were aggregated without those secrets."
          } >> "$GITHUB_STEP_SUMMARY"

  architecture_coverage:
    name: Architecture Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Strict/audit architecture coverage analysis, artifacts and PR comment. This job has its own
    # checkout and does not share a runner with repository_lint, so it builds the CLI and Testing
    # projects itself before running the CLI in `--no-build` mode below.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Build CLI and Testing projects
        run: |
          dotnet build src/ArchLinterNet.Cli/ArchLinterNet.Cli.csproj --nologo -v minimal
          dotnet build src/ArchLinterNet.Testing/ArchLinterNet.Testing.csproj --nologo -v minimal

      - name: Collect changed first-party files
        id: changed_files
        continue-on-error: true
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git diff --name-only --diff-filter=ACMR "origin/$PR_BASE_REF"...HEAD \
            -- '*.cs' ':!*.g.cs' ':!*Designer.cs' > changed-files.txt

      - name: Run architecture coverage analysis
        id: architecture_coverage
        continue-on-error: true
        run: |
          DIFF_STATUS="ok"
          if [ "${{ steps.changed_files.outcome }}" = "failure" ]; then
            DIFF_STATUS="failed"
          fi
          make architecture-coverage-ci DIFF_STATUS="$DIFF_STATUS"

      - name: Upload strict diagnostics
        if: always() && hashFiles('architecture-strict.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-strict
          path: architecture-strict.json

      - name: Upload audit diagnostics
        if: always() && hashFiles('architecture-audit.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-audit
          path: architecture-audit.json

      - name: Upload architecture coverage report
        if: always() && hashFiles('architecture-coverage.md') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-coverage-report
          path: architecture-coverage.md

      - name: Comment architecture coverage on pull request
        if: always() && hashFiles('architecture-coverage.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- architecture-coverage-report -->';
            const body = `${marker}\n${fs.readFileSync('architecture-coverage.md', 'utf8')}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if strict architecture coverage failed
        if: steps.architecture_coverage.outcome == 'failure'
        run: exit 1

  tooling_support_tests:
    name: Tooling / Support Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Python tooling tests not coupled to Sonar coverage collection — see coverage_sonar for the
    # coverage-instrumented run of the same suites, which feeds SonarCloud/Codecov.
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Test architecture coverage report generator
        run: make test-architecture-coverage-report

      - name: Test packed-artifact release-evidence aggregator
        run: make test-release-evidence

      - name: Test release version-calculation script
        run: make test-calculate-version

      - name: Test test-coverage badge Markdown generator
        run: make test-coverage-badge-script

  # Unit, ordinary E2E, and the packed-artifact release gate used to run as two `dotnet test`
  # processes inside one `make test` per platform, so the heaviest two suites always contended for
  # the same hosted runner. Each bucket now gets its own matrix job/leg per platform (no artificial
  # `needs:` between them) so they schedule and run concurrently on independent runners instead.
  # See `make/test.mk` for the bucket filter definitions and placement rules.
  # ArchLinterNet.Core.Tests has no assembly-level NUnit parallelism and is the dominant cost
  # inside the unit bucket (see docs/internal/core-unit-shard-inventory.md), so it now runs as two
  # deterministic shards (make/test.mk: TEST_CORE_UNIT_SHARD_1_FILTER/TEST_CORE_UNIT_SHARD_2_FILTER)
  # instead of one monolithic per-platform job. Each (platform, shard) pair is its own matrix leg —
  # no artificial `needs:` between shards, matching the unsharded e2e_tests/packed_artifact_tests
  # jobs below. Shard 1's legs also run the unit bucket's non-Core assemblies (CEL.Tests/Cli.Tests
  # — both already fast and, for Cli.Tests, already internally parallel) via test-unit-other, so
  # every unit-eligible assembly still runs exactly once across the full unit_tests matrix.
  unit_tests:
    name: Unit Test Suite (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    # Coverage-eligible unit/in-process correctness only — no subprocess builds or packing.
    # Measured on the #475 topology PR (pre-sharding): Apple Silicon macOS ~4.8m, Windows ~10m for
    # the WHOLE unsharded bucket. Each shard leg here covers roughly half of that by discovered
    # test count (see docs/internal/core-unit-shard-inventory.md), but local measurements swung
    # wildly between shard-balance attempts and are not trusted as a predictor of CI timing — 20m
    # keeps meaningful headroom below the prior 30m unsharded budget without repeating the flaky
    # early-cancellation mistake #481 already documented from a too-tight cap. Tighten once real
    # per-leg CI timings land.
    #
    # macos-15-intel was dropped from this matrix (and from e2e_tests/packed_artifact_tests below):
    # GitHub's Intel macOS runners are older hardware than the Apple Silicon (macos-14) runners and
    # ran the unit bucket roughly 2x slower (~12m vs ~5-7m) for no additional correctness signal on
    # this .NET/cross-platform-file-handling codebase — Apple Silicon macOS coverage is sufficient.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows / Core Shard 1
            shard: 1
          - os: windows-latest
            name: Windows / Core Shard 2
            shard: 2
          - os: macos-14
            name: Apple Silicon macOS / Core Shard 1
            shard: 1
          - os: macos-14
            name: Apple Silicon macOS / Core Shard 2
            shard: 2
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon macOS runner
        if: matrix.os == 'macos-14'
        run: test "$(uname -m)" = arm64

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: make restore

      - name: Run Core unit shard ${{ matrix.shard }}
        shell: bash
        run: make test-unit-core-${{ matrix.shard }}

      - name: Run non-Core unit assemblies (CEL.Tests, Cli.Tests)
        if: matrix.shard == 1
        shell: bash
        run: make test-unit-other

  e2e_tests:
    name: E2E Test Suite (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    # Ordinary E2E: real CLI subprocess builds and full-assembly analyses, excluding the
    # packed-artifact release gate (see packed_artifact_tests below).
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: Apple Silicon macOS
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon macOS runner
        if: matrix.os == 'macos-14'
        run: test "$(uname -m)" = arm64

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: make restore

      - name: Run E2E test suite
        shell: bash
        run: make test-e2e

  packed_artifact_tests:
    name: Packed Artifact Test Suite (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    # CheckpointBReleaseGateTests only: packs the whole solution, installs the candidate tool from
    # an isolated feed, and runs the consumer-cleanup scenario matrix against it — materially
    # heavier than ordinary E2E, so it gets a longer budget.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: Apple Silicon macOS
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon macOS runner
        if: matrix.os == 'macos-14'
        run: test "$(uname -m)" = arm64

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: make restore

      - name: Run packed-artifact test suite
        shell: bash
        run: make test-packed-artifact

  main_badge_refresh:
    name: Main Badge Refresh
    needs: dotnet_coverage
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Main push coverage is produced by the same isolated coverage-shard matrix as PR coverage.
    # This job only aggregates those reports, performs the Sonar-required build inside begin/end,
    # collects Python tooling coverage, uploads Codecov, and waits for the quality gate.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Require successful .NET coverage shards
        if: needs.dotnet_coverage.result != 'success'
        run: |
          echo ".NET coverage shard matrix result: ${{ needs.dotnet_coverage.result }}" >&2
          echo "Main Badge Refresh requires every coverage shard to succeed; refusing a partial aggregate." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download .NET coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dotnet-coverage-*
          path: test-results/coverage-shards

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Restore
        run: make restore

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Validate SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          missing=()
          [[ -n "$SONAR_TOKEN" ]] || missing+=("SONAR_TOKEN secret")
          [[ -n "$SONAR_PROJECT_KEY" ]] || missing+=("SONAR_PROJECT_KEY repository variable or committed default")
          [[ -n "$SONAR_ORGANIZATION" ]] || missing+=("SONAR_ORGANIZATION repository variable or committed default")

          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing SonarCloud configuration: %s\n' "${missing[*]}" >&2
            echo "Configure GitHub secret SONAR_TOKEN and, if overriding defaults, repository variables SONAR_PROJECT_KEY / SONAR_ORGANIZATION." >&2
            exit 1
          fi

      - name: Begin SonarCloud analysis
        id: sonar_begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.cs.opencover.reportsPaths="test-results/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="test-results/**/*.trx" \
            /d:sonar.python.coverage.reportPaths="coverage-python.xml" \
            /d:sonar.exclusions="**/AdoptionAcceptance/Fixtures/**" \
            /d:sonar.coverage.exclusions="tools/**/tests/**,**/CheckpointBReleaseGateTests*.cs"

      - name: Build for SonarCloud analysis
        run: dotnet build ArchLinterNet.slnx --no-restore --nologo

      - name: Collect main branch Python tooling coverage
        run: make test-tooling-coverage

      - name: Resolve coverage report paths
        id: coverage_reports
        shell: bash
        run: |
          files="$(find test-results -name 'coverage.cobertura.xml' -print | sed 's#^#./#' | paste -sd, -)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No .NET Cobertura coverage reports were downloaded." >&2
            exit 1
          fi

      - name: Upload test coverage to Codecov
        if: steps.coverage_reports.outputs.files != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

      - name: End SonarCloud analysis
        id: sonar_end
        if: success() && steps.sonar_begin.outcome == 'success'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
