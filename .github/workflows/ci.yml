name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'eugenemalaschuk-source_arch-linter-net' }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'eugenemalaschuk-source' }}

jobs:
  # The former monolithic `pull_request_validate` job packed workflow lint, repository lint,
  # SonarCloud/coverage, architecture coverage, and Python tooling tests into one serial job, so
  # unrelated checks waited behind whichever ran first. It is now five independently schedulable
  # jobs along real dependency boundaries; `needs:` is used only where a job genuinely requires
  # another's artifact or result (none of the five below do).
  workflow_quality:
    name: Workflow Quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # actionlint, zizmor, and the workflow Prettier check only — no .NET restore, so this fails
    # fast independently of every other pull-request validation job.
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          shellcheck: false
          pyflakes: false
          cache: true
          fail-on-error: true

      - name: Lint workflows with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054
        with:
          advanced-security: false
          annotations: false
          min-severity: low
          inputs: .github/workflows

      - name: Check workflow formatting
        run: npx --yes --ignore-scripts prettier@3.9.5 --check ".github/workflows/*.yml"

  repository_lint:
    name: Repository Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # `make lint` (code size, dotnet format, self-architecture, docs) — not coupled to Sonar or
    # coverage collection.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Lint
        run: make lint

  coverage_sonar:
    name: Coverage + Sonar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # SonarScanner for .NET requires begin -> build/test -> end in one job. Keeps only the
    # unit-only coverage run (see make/test.mk — E2E/packed-artifact correctness runs in the
    # independent test-suite jobs below), Python tooling coverage feeding the same Sonar analysis,
    # and the Codecov upload. A cancelled `End SonarCloud analysis` step means this budget was
    # exceeded, not a scanner fault.
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TRUSTED_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Cache SonarQube packages
        if: env.TRUSTED_PR == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        if: env.TRUSTED_PR == 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Validate SonarCloud configuration
        if: env.TRUSTED_PR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          missing=()
          [[ -n "$SONAR_TOKEN" ]] || missing+=("SONAR_TOKEN secret")
          [[ -n "$SONAR_PROJECT_KEY" ]] || missing+=("SONAR_PROJECT_KEY repository variable or committed default")
          [[ -n "$SONAR_ORGANIZATION" ]] || missing+=("SONAR_ORGANIZATION repository variable or committed default")

          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing SonarCloud configuration: %s\n' "${missing[*]}" >&2
            echo "Configure GitHub secret SONAR_TOKEN and, if overriding defaults, repository variables SONAR_PROJECT_KEY / SONAR_ORGANIZATION." >&2
            exit 1
          fi

      - name: Begin SonarCloud analysis
        id: sonar_begin
        if: env.TRUSTED_PR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.cs.opencover.reportsPaths="test-results/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="test-results/**/*.trx" \
            /d:sonar.python.coverage.reportPaths="coverage-python.xml" \
            /d:sonar.exclusions="**/AdoptionAcceptance/Fixtures/**" \
            /d:sonar.coverage.exclusions="tools/**/tests/**,**/CheckpointBReleaseGateTests*.cs"

      - name: Collect test coverage
        run: make test-coverage

      - name: Collect Python tooling coverage
        run: make test-tooling-coverage

      - name: Resolve coverage report paths
        id: coverage_reports
        shell: bash
        run: |
          files="$(find test-results -name 'coverage.cobertura.xml' -print | sed 's#^#./#' | paste -sd, -)"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload test coverage to Codecov
        if: steps.coverage_reports.outputs.files != '' && env.TRUSTED_PR == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

      - name: End SonarCloud analysis
        id: sonar_end
        if: success() && steps.sonar_begin.outcome == 'success'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publish SonarCloud PR summary link
        if: always() && env.TRUSTED_PR == 'true'
        shell: bash
        run: |
          {
            echo "### SonarCloud PR analysis"
            echo
            echo "- Scanner completion: ${{ steps.sonar_end.outcome || 'skipped' }}"
            echo "- Coverage reports: ${{ steps.coverage_reports.outputs.files != '' && 'found' || 'not found' }}"
            echo "- Quality gate check: review the Sonar-created GitHub status/check on this pull request."
            echo "- SonarCloud PR analysis: [Open SonarCloud PR report](https://sonarcloud.io/summary/new_code?id=${SONAR_PROJECT_KEY}&pullRequest=${{ github.event.pull_request.number }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain secret-backed integration skip
        if: always() && env.TRUSTED_PR != 'true'
        shell: bash
        run: |
          {
            echo "### Secret-backed integrations"
            echo
            echo "SonarCloud and Codecov uploads were skipped because GitHub does not expose ordinary repository secrets to fork or Dependabot pull requests."
            echo "Coverage collection continues to run without those secrets."
          } >> "$GITHUB_STEP_SUMMARY"

  architecture_coverage:
    name: Architecture Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Strict/audit architecture coverage analysis, artifacts and PR comment. This job has its own
    # checkout and does not share a runner with repository_lint, so it builds the CLI and Testing
    # projects itself before running the CLI in `--no-build` mode below.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Build CLI and Testing projects
        run: |
          dotnet build src/ArchLinterNet.Cli/ArchLinterNet.Cli.csproj --nologo -v minimal
          dotnet build src/ArchLinterNet.Testing/ArchLinterNet.Testing.csproj --nologo -v minimal

      - name: Collect changed first-party files
        id: changed_files
        continue-on-error: true
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git diff --name-only --diff-filter=ACMR "origin/$PR_BASE_REF"...HEAD \
            -- '*.cs' ':!*.g.cs' ':!*Designer.cs' > changed-files.txt

      - name: Run architecture coverage analysis
        id: architecture_coverage
        continue-on-error: true
        run: |
          DIFF_STATUS="ok"
          if [ "${{ steps.changed_files.outcome }}" = "failure" ]; then
            DIFF_STATUS="failed"
          fi
          make architecture-coverage-ci DIFF_STATUS="$DIFF_STATUS"

      - name: Upload strict diagnostics
        if: always() && hashFiles('architecture-strict.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-strict
          path: architecture-strict.json

      - name: Upload audit diagnostics
        if: always() && hashFiles('architecture-audit.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-audit
          path: architecture-audit.json

      - name: Upload architecture coverage report
        if: always() && hashFiles('architecture-coverage.md') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-coverage-report
          path: architecture-coverage.md

      - name: Comment architecture coverage on pull request
        if: always() && hashFiles('architecture-coverage.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- architecture-coverage-report -->';
            const body = `${marker}\n${fs.readFileSync('architecture-coverage.md', 'utf8')}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if strict architecture coverage failed
        if: steps.architecture_coverage.outcome == 'failure'
        run: exit 1

  tooling_support_tests:
    name: Tooling / Support Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Python tooling tests not coupled to Sonar coverage collection — see coverage_sonar for the
    # coverage-instrumented run of the same suites, which feeds SonarCloud/Codecov.
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Test architecture coverage report generator
        run: make test-architecture-coverage-report

      - name: Test packed-artifact release-evidence aggregator
        run: make test-release-evidence

      - name: Test release version-calculation script
        run: make test-calculate-version

      - name: Test test-coverage badge Markdown generator
        run: make test-coverage-badge-script

  # Unit, ordinary E2E, and the packed-artifact release gate used to run as two `dotnet test`
  # processes inside one `make test` per platform, so the heaviest two suites always contended for
  # the same hosted runner. Each bucket now gets its own matrix job/leg per platform (no artificial
  # `needs:` between them) so they schedule and run concurrently on independent runners instead.
  # See `make/test.mk` for the bucket filter definitions and placement rules.
  unit_tests:
    name: Unit Test Suite (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    # Coverage-eligible unit/in-process correctness only — no subprocess builds or packing.
    # Measured on the #475 topology PR: Apple Silicon macOS ~4.8m, Windows ~10m — the unit bucket
    # alone runs meaningfully slower on Windows than on macOS. 30m gives headroom until enough
    # Windows runs land to tighten this with real data.
    #
    # macos-15-intel was dropped from this matrix (and from e2e_tests/packed_artifact_tests below):
    # GitHub's Intel macOS runners are older hardware than the Apple Silicon (macos-14) runners and
    # ran the unit bucket roughly 2x slower (~12m vs ~5-7m) for no additional correctness signal on
    # this .NET/cross-platform-file-handling codebase — Apple Silicon macOS coverage is sufficient.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: Apple Silicon macOS
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon macOS runner
        if: matrix.os == 'macos-14'
        run: test "$(uname -m)" = arm64

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: make restore

      - name: Run unit test suite
        shell: bash
        run: make test-unit

  e2e_tests:
    name: E2E Test Suite (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    # Ordinary E2E: real CLI subprocess builds and full-assembly analyses, excluding the
    # packed-artifact release gate (see packed_artifact_tests below).
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: Apple Silicon macOS
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon macOS runner
        if: matrix.os == 'macos-14'
        run: test "$(uname -m)" = arm64

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: make restore

      - name: Run E2E test suite
        shell: bash
        run: make test-e2e

  packed_artifact_tests:
    name: Packed Artifact Test Suite (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    # CheckpointBReleaseGateTests only: packs the whole solution, installs the candidate tool from
    # an isolated feed, and runs the consumer-cleanup scenario matrix against it — materially
    # heavier than ordinary E2E, so it gets a longer budget.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: Apple Silicon macOS
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon macOS runner
        if: matrix.os == 'macos-14'
        run: test "$(uname -m)" = arm64

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: make restore

      - name: Run packed-artifact test suite
        shell: bash
        run: make test-packed-artifact

  main_badge_refresh:
    name: Main Badge Refresh
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # This job does the most work of any in the workflow: a full build, the unit-only coverage run
    # (see make/test.mk — E2E/packed-artifact correctness moved to the independent test-suite jobs,
    # no longer on this critical path), and a SonarCloud analysis whose `end` step waits on the
    # quality gate for up to `sonar.qualitygate.timeout=300` seconds. At 10 minutes the coverage step
    # alone (~9 minutes on ubuntu-latest, when it still ran units then E2E sequentially) left the
    # quality-gate wait no room, so the job was cancelled at the cap rather than failing on a real
    # signal. 25 minutes matches Pull Request Validation; revisit once a push to `main` produces a
    # real unit-only timing for this job.
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Restore
        run: make restore

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Validate SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          missing=()
          [[ -n "$SONAR_TOKEN" ]] || missing+=("SONAR_TOKEN secret")
          [[ -n "$SONAR_PROJECT_KEY" ]] || missing+=("SONAR_PROJECT_KEY repository variable or committed default")
          [[ -n "$SONAR_ORGANIZATION" ]] || missing+=("SONAR_ORGANIZATION repository variable or committed default")

          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing SonarCloud configuration: %s\n' "${missing[*]}" >&2
            echo "Configure GitHub secret SONAR_TOKEN and, if overriding defaults, repository variables SONAR_PROJECT_KEY / SONAR_ORGANIZATION." >&2
            exit 1
          fi

      - name: Begin SonarCloud analysis
        id: sonar_begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.cs.opencover.reportsPaths="test-results/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="test-results/**/*.trx" \
            /d:sonar.python.coverage.reportPaths="coverage-python.xml" \
            /d:sonar.exclusions="**/AdoptionAcceptance/Fixtures/**" \
            /d:sonar.coverage.exclusions="tools/**/tests/**,**/CheckpointBReleaseGateTests*.cs"

      - name: Collect main branch test coverage
        run: make test-coverage-main-ci

      - name: Collect main branch Python tooling coverage
        run: make test-tooling-coverage

      - name: Resolve coverage report paths
        id: coverage_reports
        shell: bash
        run: |
          files="$(find test-results -name 'coverage.cobertura.xml' -print | sed 's#^#./#' | paste -sd, -)"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload test coverage to Codecov
        if: steps.coverage_reports.outputs.files != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: false

      - name: End SonarCloud analysis
        id: sonar_end
        if: success() && steps.sonar_begin.outcome == 'success'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
