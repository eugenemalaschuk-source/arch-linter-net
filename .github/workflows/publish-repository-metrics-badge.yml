name: Publish Repository Metrics Badge

on:
  workflow_run:
    workflows: ["Publish Architecture Health Badge"]
    types: [completed]
    branches: [main]

concurrency:
  group: repository-metrics-badge-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Read the published Architecture Health artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/architecture-health-badge/architecture-health.json?run=${{ github.event.workflow_run.id }}" \
            --output "$RUNNER_TEMP/architecture-health.json"

      - name: Project the Source lines badge
        shell: bash
        run: |
          set +e
          dotnet run --project src/ArchLinterNet.Cli/ArchLinterNet.Cli.csproj -- \
            badge repository-metrics \
            --input "$RUNNER_TEMP/architecture-health.json" \
            --output "$RUNNER_TEMP/repository-metrics.json"
          status=$?
          set -e
          test -s "$RUNNER_TEMP/repository-metrics.json"
          if [ "$status" -ne 0 ]; then
            echo "Repository metrics were unavailable; publishing the explicit unavailable badge payload."
          fi

      - name: Publish beside the existing Architecture Health payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin architecture-health-badge
          git switch --create architecture-health-badge --track origin/architecture-health-badge
          cp "$RUNNER_TEMP/repository-metrics.json" repository-metrics.json
          git add repository-metrics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: publish repository metrics badge"
          git push origin HEAD:architecture-health-badge
