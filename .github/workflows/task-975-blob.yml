name: Task 975 workflow blob transfer
on:
  push:
    branches: [task/975-release-preparation]
    paths: [.github/workflows/task-975-blob.yml]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'eugenemalaschuk-source/arch-linter-net'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Store exact bytes without changing any path or ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          patch = gzip.decompress(base64.b64decode(Path('.github/task-975/implementation.patch.gz.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'dfa48ea50000d1446fa1334fd1943c1d0e93c96d3d54ae4c81d11ce0e7715514'
          subprocess.run(['git', 'checkout', '--detach', 'e4af794f27f311e90602e8f032b6b7ff38738042'], check=True)
          subprocess.run(['git', 'apply', '--include=.github/workflows/release-nuget.yml', '-'], input=patch, check=True)
          text = Path('.github/workflows/release-nuget.yml').read_text()
          old = next(line for line in text.splitlines() if 'echo "PACKAGE_RELEASE_NOTES=' in line)
          new = old.replace('opt-in; full', 'opt-in. Its full').replace('governance, private', 'governance plus private').replace('none; no', 'none. There is no').replace('security, privacy, integrity, data-corruption', 'security or privacy or integrity or data-corruption')
          assert text.count(old) == 1
          text = text.replace(old, new)
          data = text.encode()
          digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert digest == 'e47892d471cb261535fef4e045ff3d1d3e91d009', digest
          output = Path(os.environ['RUNNER_TEMP']) / 'task-975-blob'
          output.mkdir()
          request = output / 'request.json'
          request.write_text(json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}))
          response = subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', '--input', str(request)], text=True)
          result = json.loads(response)
          assert result['sha'] == digest
          (output / 'result.json').write_text(response)
          request.unlink()
          print('Stored unreferenced blob:', digest)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: task-975-workflow-blob
          path: ${{ runner.temp }}/task-975-blob/result.json
          retention-days: 7
          if-no-files-found: error
