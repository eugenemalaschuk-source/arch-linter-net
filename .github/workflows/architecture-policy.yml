name: Architecture Policy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: architecture-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  strict_self_policy:
    name: Strict Self-Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Download strict validation result
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.event.workflow_run.id }}" --name architecture-strict

      - name: Generate strict architecture-policy badge payload
        run: dotnet run --project src/ArchLinterNet.Cli -- badge architecture-policy --input architecture-strict.json
