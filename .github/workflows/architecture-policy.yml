name: Architecture Policy

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: architecture-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict_self_policy:
    name: Strict Self-Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: make restore

      - name: Generate strict architecture-policy badge payload
        run: >-
          dotnet run --project src/ArchLinterNet.Cli -- badge architecture-policy
          --policy architecture/dependencies.arch.yml --ensure-built
