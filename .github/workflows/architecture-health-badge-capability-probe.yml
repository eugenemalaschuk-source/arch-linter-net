name: Architecture Health capability probe

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      visibility:
        required: true
        type: string
      account:
        required: true
        type: string
      base-ref:
        required: true
        type: string
      audience:
        required: true
        type: string
      check-name:
        required: true
        type: string
      expected-ref:
        required: true
        type: string
      expected-workflow-ref:
        required: true
        type: string
      expected-workflow-sha:
        required: true
        type: string
    secrets:
      cf_api_token:
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Probe trusted capability handoff without disclosure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CF_API_TOKEN: ${{ secrets.cf_api_token }}
          PROBE_REPOSITORY: ${{ inputs.repository }}
          PROBE_VISIBILITY: ${{ inputs.visibility }}
          PROBE_ACCOUNT: ${{ inputs.account }}
          PROBE_BASE_REF: ${{ inputs.base-ref }}
          PROBE_AUDIENCE: ${{ inputs.audience }}
          PROBE_CHECK_NAME: ${{ inputs.check-name }}
          EXPECTED_REF: ${{ inputs.expected-ref }}
          EXPECTED_WORKFLOW_REF: ${{ inputs.expected-workflow-ref }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected-workflow-sha }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          results = {}

          def request(url, headers=None):
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(url, headers=headers or {}), timeout=5
                  ) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, b""
              except OSError:
                  return 0, b""

          def decode(segment):
              return json.loads(base64.urlsafe_b64decode(segment + "=" * (-len(segment) % 4)))

          def decode_bytes(segment):
              return base64.urlsafe_b64decode(segment + "=" * (-len(segment) % 4))

          def der_length(length):
              if length < 128:
                  return bytes([length])
              encoded = length.to_bytes((length.bit_length() + 7) // 8, "big")
              return bytes([0x80 | len(encoded)]) + encoded

          def der_integer(value):
              value = value.lstrip(b"\x00") or b"\x00"
              if value[0] & 0x80:
                  value = b"\x00" + value
              return b"\x02" + der_length(len(value)) + value

          def rsa_public_pem(modulus, exponent):
              body = der_integer(modulus) + der_integer(exponent)
              der = b"\x30" + der_length(len(body)) + body
              text = base64.b64encode(der).decode()
              lines = [text[index:index + 64] for index in range(0, len(text), 64)]
              return "-----BEGIN RSA PUBLIC KEY-----\n" + "\n".join(lines) + "\n-----END RSA PUBLIC KEY-----\n"

          def verify_signature(token, header, jwks):
              if header.get("alg") != "RS256" or not isinstance(header.get("kid"), str):
                  return False
              key = next((item for item in jwks.get("keys", []) if item.get("kid") == header["kid"]), None)
              if not isinstance(key, dict) or key.get("kty") != "RSA":
                  return False
              try:
                  modulus = decode_bytes(key["n"])
                  exponent = decode_bytes(key["e"])
                  signed, _, signature = token.encode().partition(b".")
                  signed += b"." + token.encode().split(b".", 2)[1]
                  signature = decode_bytes(token.split(".", 2)[2])
              except (KeyError, ValueError):
                  return False
              with tempfile.TemporaryDirectory() as directory:
                  key_path = os.path.join(directory, "key.pem")
                  payload_path = os.path.join(directory, "payload")
                  signature_path = os.path.join(directory, "signature")
                  with open(key_path, "w", encoding="ascii") as stream:
                      stream.write(rsa_public_pem(modulus, exponent))
                  with open(payload_path, "wb") as stream:
                      stream.write(signed)
                  with open(signature_path, "wb") as stream:
                      stream.write(signature)
                  return subprocess.run(
                      ["openssl", "dgst", "-sha256", "-verify", key_path, "-signature", signature_path, payload_path],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                  ).returncode == 0

          github_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "User-Agent": "arch-linter-net-capability-probe",
          }
          repository = os.environ["PROBE_REPOSITORY"]
          github_api = f"https://api.github.com/repos/{repository}"
          repository_status, repository_body = request(github_api, github_headers)
          branch_status, branch_body = request(
              f"{github_api}/branches/{urllib.parse.quote(os.environ['PROBE_BASE_REF'], safe='')}",
              github_headers,
          )
          rules_status, rules_body = request(
              f"{github_api}/rules/branches/{urllib.parse.quote(os.environ['PROBE_BASE_REF'], safe='')}",
              github_headers,
          )
          try:
              repository_json = json.loads(repository_body)
              branch_json = json.loads(branch_body)
              rules_json = json.loads(rules_body)
              results["github_repository_identity"] = (
                  repository_status == 200
                  and repository_json.get("visibility") == os.environ["PROBE_VISIBILITY"]
              )
              results["github_base_ref"] = branch_status == 200 and branch_json.get("name") == os.environ["PROBE_BASE_REF"]
              results["github_required_check"] = (
                  rules_status == 200
                  and any(
                      rule.get("type") == "required_status_checks"
                      and rule.get("parameters", {}).get("strict_required_status_checks_policy") is True
                      and any(
                          check.get("context") == os.environ["PROBE_CHECK_NAME"]
                          for check in rule.get("parameters", {}).get("required_status_checks", [])
                      )
                      for rule in rules_json
                  )
              )
          except (TypeError, ValueError):
              results["github_repository_identity"] = False
              results["github_base_ref"] = False
              results["github_required_check"] = False

          token_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          token_request = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          results["oidc_request_environment"] = bool(token_url and token_request)
          if token_url and token_request:
              separator = "&" if "?" in token_url else "?"
              oidc_status, oidc_body = request(
                  token_url + separator + urllib.parse.urlencode({"audience": os.environ["PROBE_AUDIENCE"]}),
                  {"Accept": "application/jwt", "Authorization": f"Bearer {token_request}"},
              )
              results["oidc_token_issued"] = oidc_status == 200
              try:
                  raw_token = oidc_body.decode()
                  try:
                      envelope = json.loads(raw_token)
                      token = envelope.get("value", raw_token) if isinstance(envelope, dict) else raw_token
                  except ValueError:
                      token = raw_token
                  segments = token.split(".")
                  header = decode(segments[0])
                  payload = decode(segments[1])
                  results["oidc_event"] = payload.get("event_name") == "workflow_dispatch"
                  results["oidc_ref"] = payload.get("ref") == f"refs/heads/{os.environ['EXPECTED_REF']}"
                  results["oidc_workflow_ref"] = payload.get("job_workflow_ref") == os.environ["EXPECTED_WORKFLOW_REF"]
                  results["oidc_workflow_sha"] = payload.get("job_workflow_sha") == os.environ["EXPECTED_WORKFLOW_SHA"]
                  results["oidc_issuer"] = payload.get("iss") == "https://token.actions.githubusercontent.com"
                  audience = payload.get("aud")
                  results["oidc_audience"] = (
                      audience == os.environ["PROBE_AUDIENCE"]
                      or isinstance(audience, list) and os.environ["PROBE_AUDIENCE"] in audience
                  )
                  results["oidc_repository_identity"] = (
                      payload.get("repository") == repository
                      and payload.get("repository_visibility") == os.environ["PROBE_VISIBILITY"]
                      and payload.get("repository_id") == repository_json.get("id")
                      and payload.get("repository_owner_id") == repository_json.get("owner", {}).get("id")
                  )
                  results["oidc_subject"] = payload.get("sub") == f"repo:{repository}:ref:refs/heads/{os.environ['EXPECTED_REF']}"
                  now = int(time.time())
                  results["oidc_time_window"] = (
                      isinstance(payload.get("iat"), int)
                      and isinstance(payload.get("nbf"), int)
                      and isinstance(payload.get("exp"), int)
                      and payload["iat"] <= now + 300
                      and payload["nbf"] <= now + 300
                      and payload["exp"] >= now - 300
                      and payload["exp"] > payload["iat"]
                      and payload["exp"] - payload["iat"] <= 600
                  )
                  jwks_status, jwks_body = request("https://token.actions.githubusercontent.com/.well-known/jwks")
                  results["oidc_jwks"] = jwks_status == 200
                  try:
                      results["oidc_signature"] = results["oidc_jwks"] and verify_signature(token, header, json.loads(jwks_body))
                  except (TypeError, ValueError):
                      results["oidc_signature"] = False
              except (IndexError, TypeError, UnicodeDecodeError, ValueError):
                  results["oidc_event"] = False
                  results["oidc_ref"] = False
                  results["oidc_workflow_ref"] = False
                  results["oidc_workflow_sha"] = False
                  results["oidc_issuer"] = False
                  results["oidc_audience"] = False
                  results["oidc_repository_identity"] = False
                  results["oidc_subject"] = False
                  results["oidc_time_window"] = False
                  results["oidc_jwks"] = False
                  results["oidc_signature"] = False
          else:
              results["oidc_token_issued"] = False
              results["oidc_event"] = False
              results["oidc_ref"] = False
              results["oidc_workflow_ref"] = False
              results["oidc_workflow_sha"] = False
              results["oidc_issuer"] = False
              results["oidc_audience"] = False
              results["oidc_repository_identity"] = False
              results["oidc_subject"] = False
              results["oidc_time_window"] = False
              results["oidc_jwks"] = False
              results["oidc_signature"] = False

          cf_headers = {"Authorization": f"Bearer {os.environ['CF_API_TOKEN']}"}
          cf_base = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['PROBE_ACCOUNT']}"
          account_status, account_body = request(cf_base, cf_headers)
          scripts_status, _ = request(f"{cf_base}/workers/scripts", cf_headers)
          durable_objects_status, _ = request(f"{cf_base}/workers/durable_objects/namespaces", cf_headers)
          try:
              account_json = json.loads(account_body)
              results["cloudflare_account_identity"] = (
                  account_status == 200
                  and account_json.get("success") is True
                  and account_json.get("result", {}).get("id") == os.environ["PROBE_ACCOUNT"]
              )
          except (TypeError, ValueError):
              results["cloudflare_account_identity"] = False
          results["cloudflare_workers"] = scripts_status == 200
          results["cloudflare_durable_objects"] = durable_objects_status == 200

          for name, value in results.items():
              print(f"capability.{name}={'PASS' if value else 'FAIL'}")

          if not all(results.values()):
              raise SystemExit(2)
          PY
