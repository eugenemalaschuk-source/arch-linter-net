name: Main NuGet Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish installable main build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    outputs:
      package_version: ${{ steps.version.outputs.package_version }}

    env:
      PACKAGE_OUTPUT: artifacts/main-packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve main build version
        id: version
        shell: bash
        run: |
          python3 tools/release/main_build.py version \
            --props Directory.Build.props \
            --build-number "$GITHUB_RUN_NUMBER" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore
        run: make restore

      - name: Build main package candidate
        shell: bash
        run: |
          rm -rf "$PACKAGE_OUTPUT"
          mkdir -p "$PACKAGE_OUTPUT"
          dotnet build ArchLinterNet.slnx \
            --configuration Release \
            --no-restore \
            --nologo \
            -p:Version="$PACKAGE_VERSION"

      - name: Prepare development package release notes
        shell: bash
        run: |
          echo "PACKAGE_RELEASE_NOTES=Development build from main commit $GITHUB_SHA. Not a public release." >> "$GITHUB_ENV"

      - name: Pack CEL
        run: dotnet pack src/ArchLinterNet.CEL/ArchLinterNet.CEL.csproj --configuration Release --no-build --output "$PACKAGE_OUTPUT" -p:PackageVersion="$PACKAGE_VERSION" -p:Version="$PACKAGE_VERSION" -p:PackageReleaseNotes="$PACKAGE_RELEASE_NOTES"

      - name: Pack Core
        run: dotnet pack src/ArchLinterNet.Core/ArchLinterNet.Core.csproj --configuration Release --no-build --output "$PACKAGE_OUTPUT" -p:PackageVersion="$PACKAGE_VERSION" -p:Version="$PACKAGE_VERSION" -p:PackageReleaseNotes="$PACKAGE_RELEASE_NOTES"

      - name: Pack CLI
        run: dotnet pack src/ArchLinterNet.Cli/ArchLinterNet.Cli.csproj --configuration Release --no-build --output "$PACKAGE_OUTPUT" -p:PackageVersion="$PACKAGE_VERSION" -p:Version="$PACKAGE_VERSION" -p:PackageReleaseNotes="$PACKAGE_RELEASE_NOTES"

      - name: Pack Testing
        run: dotnet pack src/ArchLinterNet.Testing/ArchLinterNet.Testing.csproj --configuration Release --no-build --output "$PACKAGE_OUTPUT" -p:PackageVersion="$PACKAGE_VERSION" -p:Version="$PACKAGE_VERSION" -p:PackageReleaseNotes="$PACKAGE_RELEASE_NOTES"

      - name: Create and verify package manifest
        shell: bash
        run: |
          python3 tools/release/package_manifest.py create \
            --packages-dir "$PACKAGE_OUTPUT" \
            --version "$PACKAGE_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --output "$PACKAGE_OUTPUT/package-manifest.json"
          python3 tools/release/package_manifest.py verify \
            --packages-dir "$PACKAGE_OUTPUT" \
            --manifest "$PACKAGE_OUTPUT/package-manifest.json" \
            --version "$PACKAGE_VERSION" \
            --source-commit "$GITHUB_SHA"

      - name: Configure GitHub Packages NuGet source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source \
            --username "$GITHUB_ACTOR" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json"

      - name: Publish main package set to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_ids=(
            ArchLinterNet.CEL
            ArchLinterNet.Cli
            ArchLinterNet.Core
            ArchLinterNet.Testing
          )
          mapfile -t packages < <(
            python3 tools/release/package_manifest.py paths \
              --packages-dir "$PACKAGE_OUTPUT" \
              --manifest "$PACKAGE_OUTPUT/package-manifest.json" \
              --kind package
          )
          test "${#packages[@]}" -eq "${#package_ids[@]}"

          for package in "${packages[@]}"; do
            dotnet nuget push "$PACKAGE_OUTPUT/$package" \
              --source github \
              --api-key "$GITHUB_TOKEN" \
              --no-symbols
          done

      - name: Publish main build summary
        shell: bash
        run: |
          {
            echo "### Installable ArchLinterNet main build"
            echo
            echo "- Version: \`$PACKAGE_VERSION\`"
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo "- Feed: \`https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json\`"
            echo "- Packages: ArchLinterNet.CEL, ArchLinterNet.Core, ArchLinterNet.Cli, ArchLinterNet.Testing"
            echo "- Package visibility: unchanged; main builds accept the existing GitHub Package identity visibility."
            echo "- Symbols were manifest-verified locally; GitHub Packages receives the four primary .nupkg packages only."
          } >> "$GITHUB_STEP_SUMMARY"

  retention:
    name: Verify packages, retain five complete builds, and clean stale orphans
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_VERSION: ${{ needs.publish.outputs.package_version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Packages NuGet source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source \
            --username "$GITHUB_ACTOR" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json"

      - name: Verify exact published package set is consumable
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/arch-linter-main-package-smoke"
          feed="https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json"
          export NUGET_PACKAGES="$smoke_root/nuget-packages"

          for attempt in 1 2 3 4 5 6; do
            rm -rf "$smoke_root"
            mkdir -p "$smoke_root/tool" "$smoke_root/library"

            dotnet nuget locals http-cache --clear > /dev/null
            smoke_ok=true
            if ! dotnet tool install ArchLinterNet.Cli \
              --version "$PACKAGE_VERSION" \
              --tool-path "$smoke_root/tool" \
              --add-source "$feed"; then
              smoke_ok=false
            fi

            if [ "$smoke_ok" = true ]; then
              dotnet tool list --tool-path "$smoke_root/tool" | tee "$smoke_root/tool-list.txt"
              installed_version="$(awk 'tolower($1) == "archlinternet.cli" { print $2 }' "$smoke_root/tool-list.txt")"
              if [ "$installed_version" != "$PACKAGE_VERSION" ]; then
                echo "Installed CLI package version '$installed_version' did not match $PACKAGE_VERSION." >&2
                smoke_ok=false
              elif ! "$smoke_root/tool/arch-linter-net" --help > /dev/null; then
                echo "Installed CLI entrypoint did not execute successfully." >&2
                smoke_ok=false
              fi
            fi

            if [ "$smoke_ok" = true ]; then
              (
                cd "$smoke_root/library"
                dotnet new classlib --framework net10.0 --no-restore
                dotnet add package ArchLinterNet.Testing \
                  --version "$PACKAGE_VERSION" \
                  --source "$feed" \
                  --no-restore
                dotnet restore --no-cache
                python3 "$GITHUB_WORKSPACE/tools/release/verify_restored_main_packages.py" \
                  --assets obj/project.assets.json \
                  --version "$PACKAGE_VERSION"
              ) || smoke_ok=false
            fi

            if [ "$smoke_ok" = true ]; then
              echo "Verified exact published package set $PACKAGE_VERSION from GitHub Packages."
              break
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "Could not restore exact published package set $PACKAGE_VERSION after bounded retries." >&2
              exit 1
            fi

            echo "GitHub Packages has not converged for $PACKAGE_VERSION yet; retrying ($attempt/6)." >&2
            sleep 10
          done

      - name: Resolve package owner API scope
        shell: bash
        run: |
          owner_type="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.type')"
          case "$owner_type" in
            User) package_scope="users/$GITHUB_REPOSITORY_OWNER" ;;
            Organization) package_scope="orgs/$GITHUB_REPOSITORY_OWNER" ;;
            *)
              echo "Unsupported repository owner type: $owner_type" >&2
              exit 2
              ;;
          esac
          echo "PACKAGE_API_SCOPE=$package_scope" >> "$GITHUB_ENV"

      - name: Build complete-set retention and stale-orphan cleanup plan
        shell: bash
        run: |
          set -euo pipefail
          package_ids=(
            ArchLinterNet.CEL
            ArchLinterNet.Cli
            ArchLinterNet.Core
            ArchLinterNet.Testing
          )
          stale_partial_before="$(date -u -d '1 hour ago' +'%Y-%m-%dT%H:%M:%SZ')"
          ready=false
          for attempt in 1 2 3 4 5 6; do
            rm -rf artifacts/main-package-inventory
            mkdir -p artifacts/main-package-inventory
            inventory_ok=true
            for package_id in "${package_ids[@]}"; do
              if ! gh api --paginate --slurp \
                -H "Accept: application/vnd.github+json" \
                "$PACKAGE_API_SCOPE/packages/nuget/$package_id/versions?per_page=100" \
                > "artifacts/main-package-inventory/$package_id.json"; then
                inventory_ok=false
                break
              fi
            done

            if [ "$inventory_ok" = true ] && python3 tools/release/main_build.py retention-plan \
              --inventory-dir artifacts/main-package-inventory \
              --current-version "$PACKAGE_VERSION" \
              --keep 5 \
              --prune-stale-partials \
              --stale-partial-before "$stale_partial_before" \
              --output artifacts/main-package-retention.json; then
              ready=true
              break
            fi

            echo "GitHub Packages inventory is not complete for $PACKAGE_VERSION yet; retrying ($attempt/6)." >&2
            sleep 10
          done

          if [ "$ready" != true ]; then
            echo "Could not observe a complete package set for $PACKAGE_VERSION after retries." >&2
            exit 1
          fi

      - name: Delete expired complete builds and stale package orphans
        shell: bash
        run: |
          set -euo pipefail
          jq -r '(.delete + .delete_orphans)[] | [.package_id, (.version_id | tostring), .version, .reason] | @tsv' \
            artifacts/main-package-retention.json |
          while IFS=$'\t' read -r package_id version_id version reason; do
            endpoint="$PACKAGE_API_SCOPE/packages/nuget/$package_id/versions/$version_id"
            if response="$(gh api --method DELETE -H "Accept: application/vnd.github+json" "$endpoint" 2>&1)"; then
              echo "Deleted $package_id $version ($reason)"
            elif grep -q "HTTP 404" <<< "$response"; then
              echo "$package_id $version ($reason) was already deleted by another cleanup run."
            else
              echo "$response" >&2
              exit 1
            fi
          done

      - name: Publish retention summary
        if: always() && hashFiles('artifacts/main-package-retention.json') != ''
        shell: bash
        run: |
          retained="$(jq -r '.retained_versions | join(", ")' artifacts/main-package-retention.json)"
          stale="$(jq -r 'if (.stale_partial_versions | length) == 0 then "none" else (.stale_partial_versions | join(", ")) end' artifacts/main-package-retention.json)"
          stale_before="$(jq -r '.stale_partial_before // "disabled"' artifacts/main-package-retention.json)"
          protected="$(jq -r 'if (.protected_partial_versions | length) == 0 then "none" else (.protected_partial_versions | join(", ")) end' artifacts/main-package-retention.json)"
          expired_records="$(jq -r '.delete | length' artifacts/main-package-retention.json)"
          orphan_records="$(jq -r '.delete_orphans | length' artifacts/main-package-retention.json)"
          deferred="$(jq -r '.current_retention_deferred' artifacts/main-package-retention.json)"
          {
            echo "### Main package retention"
            echo
            echo "- Exact package restore smoke: passed for \`$PACKAGE_VERSION\`"
            echo "- Retained complete builds: $retained"
            echo "- Stale partial/orphan versions selected for cleanup: $stale"
            echo "- Partial cleanup safety cutoff: $stale_before (one-hour grace)"
            echo "- Newer/concurrent partial versions preserved: $protected"
            echo "- Expired complete-build package records selected for deletion: $expired_records"
            echo "- Stale orphan package records selected for deletion: $orphan_records"
            echo "- Current-build safety deferred exact five-version convergence: $deferred"
            echo "- Newer versions and partial versions inside the grace window remain protected from cleanup."
          } >> "$GITHUB_STEP_SUMMARY"
