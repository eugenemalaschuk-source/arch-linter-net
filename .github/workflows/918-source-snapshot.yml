name: Publisher delivery source snapshot
on:
  push:
    branches: [fix/918-publisher-delivery-pins]
    paths: [.github/workflows/918-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 54557bb8549f282a4cafdda46ca6e0c3c1a5256f
          persist-credentials: false
          fetch-depth: 1
      - name: Export public source and bounded Git objects without credentials
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin ff9b19bfe5abcab233d490ea53f55a387dc4a8db
          test "$(git rev-parse HEAD)" = 54557bb8549f282a4cafdda46ca6e0c3c1a5256f
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/objects.tar.gz" .git/objects .git/shallow .git/HEAD
          sha256sum "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/objects.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publisher-delivery-source-918
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/objects.tar.gz
          retention-days: 1
          if-no-files-found: error
