name: Release NuGet packages and docs

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release scenario"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - patch
          - minor
          - major
      publish:
        description: "Publish packages to NuGet.org"
        required: true
        default: false
        type: boolean
      version_override:
        description: "Emergency/manual package version override. Leave empty for normal releases."
        required: false
        type: string

jobs:
  checkpoint-b-shards:
    name: Checkpoint B shard (${{ matrix.platform.id }} / ${{ matrix.shard.name }})
    needs: prepare-candidate
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x64
            runner: ubuntu-latest
            shell: bash
          - id: windows-x64
            runner: windows-latest
            shell: pwsh
          - id: macos-arm64
            runner: macos-14
            shell: zsh
          - id: macos-x64
            runner: macos-15-intel
            shell: zsh
        shard:
          - id: package-and-entrypoints
            name: Package + entrypoints
            target: test-packed-artifact-package-and-entrypoints
          - id: adopter-runtime-core
            name: Adopter runtime core
            target: test-packed-artifact-adopter-runtime-core
          - id: adopter-runtime-extended
            name: Adopter runtime extended
            target: test-packed-artifact-adopter-runtime-extended
          - id: consumer-cleanup-policy-execution
            name: Consumer cleanup policy execution
            target: test-packed-artifact-consumer-cleanup-policy-execution
          - id: consumer-cleanup-dependency-contract-id-parity
            name: Consumer cleanup dependency-contract id parity
            target: test-packed-artifact-consumer-cleanup-dependency-contract-id-parity
          - id: consumer-cleanup-layer-overlap-and-policy-shape
            name: Consumer cleanup layer overlap + policy shape
            target: test-packed-artifact-consumer-cleanup-layer-overlap-and-policy-shape
          - id: consumer-cleanup-configuration-and-identity
            name: Consumer cleanup configuration + identity
            target: test-packed-artifact-consumer-cleanup-configuration-and-identity
          - id: consumer-cleanup-source-set-authoring
            name: Consumer cleanup source-set authoring
            target: test-packed-artifact-consumer-cleanup-source-set-authoring
          - id: public-api-surface-selector-snapshot-and-role
            name: Public API selector snapshot + role
            target: test-packed-artifact-public-api-surface-selector-snapshot-and-role
          - id: public-api-surface-selector-delta-and-membership
            name: Public API selector delta + membership
            target: test-packed-artifact-public-api-surface-selector-delta-and-membership
          - id: public-api-surface-selector-enforcement
            name: Public API selector enforcement
            target: test-packed-artifact-public-api-surface-selector-enforcement
    env:
      ARCH_LINTER_SOURCE_SHA: ${{ github.sha }}
      CHECKPOINT_B_CANDIDATE_VERSION: ${{ needs.prepare-candidate.outputs.package_version }}
      CHECKPOINT_B_PACKAGE_MANIFEST: ${{ github.workspace }}/artifacts/candidate/package-manifest.json
      CHECKPOINT_B_PACKAGE_FEED: ${{ github.workspace }}/artifacts/candidate
      CHECKPOINT_B_EVIDENCE_DIRECTORY: ${{ github.workspace }}/artifacts/checkpoint-b-shard
      CHECKPOINT_B_PLATFORM: ${{ matrix.platform.id }}
      CHECKPOINT_B_SHELL: ${{ matrix.platform.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore packed-artifact test project
        run: dotnet restore tests/ArchLinterNet.Core.Tests/ArchLinterNet.Core.Tests.csproj --nologo

      - name: Download immutable candidate packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nuget-candidate-${{ needs.prepare-candidate.outputs.package_version }}
          path: artifacts/candidate

      - name: Verify immutable candidate packages
        run: python3 tools/release/package_manifest.py verify --packages-dir artifacts/candidate --manifest artifacts/candidate/package-manifest.json --version "$CHECKPOINT_B_CANDIDATE_VERSION" --source-commit "$ARCH_LINTER_SOURCE_SHA"

      - name: Run ${{ matrix.shard.name }} shard
        shell: bash
        run: make ${{ matrix.shard.target }}

      - name: Upload Checkpoint B shard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkpoint-b-shard-${{ matrix.platform.id }}-${{ matrix.shard.id }}
          path: artifacts/checkpoint-b-shard
          if-no-files-found: error

  checkpoint-b-platform-evidence:
    name: Checkpoint B (${{ matrix.platform.id }})
    needs: [checkpoint-b-shards, prepare-candidate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x64
          - id: windows-x64
          - id: macos-arm64
          - id: macos-x64
    permissions:
      contents: read

    steps:
      - name: Require successful Checkpoint B shards
        if: needs.checkpoint-b-shards.result != 'success' || needs.prepare-candidate.result != 'success'
        run: |
          echo "prepare-candidate: ${{ needs.prepare-candidate.result }}" >&2
          echo "checkpoint-b-shards: ${{ needs.checkpoint-b-shards.result }}" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download immutable candidate manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nuget-candidate-${{ needs.prepare-candidate.outputs.package_version }}
          path: artifacts/candidate

      - name: Download platform shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: checkpoint-b-shard-${{ matrix.platform.id }}-*
          path: artifacts/checkpoint-b-shards

      - name: Merge and validate platform evidence
        run: |
          python3 tools/release/merge_checkpoint_b_platform_evidence.py \
            --input-dir artifacts/checkpoint-b-shards \
            --candidate-manifest artifacts/candidate/package-manifest.json \
            --output artifacts/checkpoint-b/${{ matrix.platform.id }}/checkpoint-b-platform-evidence.json

      - name: Upload Checkpoint B platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkpoint-b-evidence-${{ matrix.platform.id }}
          path: artifacts/checkpoint-b/${{ matrix.platform.id }}
          if-no-files-found: error

  checkpoint-b-evidence:
    name: Aggregate Checkpoint B evidence
    needs: [checkpoint-b-platform-evidence, prepare-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Download immutable candidate manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nuget-candidate-${{ needs.prepare-candidate.outputs.package_version }}
          path: artifacts/candidate

      - name: Verify immutable candidate manifest
        run: python3 tools/release/package_manifest.py verify --packages-dir artifacts/candidate --manifest artifacts/candidate/package-manifest.json --version "${{ needs.prepare-candidate.outputs.package_version }}" --source-commit "$GITHUB_SHA"

      - name: Download repository-gate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: checkpoint-b-repository-gates-${{ needs.prepare-candidate.outputs.package_version }}
          path: artifacts/checkpoint-b

      - name: Resolve authoritative release scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/create_release_scope_evidence.py --source-commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Download platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: checkpoint-b-evidence-*
          path: artifacts/checkpoint-b/platforms

      - name: Generate deterministic release evidence
        run: python3 tools/release/aggregate_checkpoint_b_evidence.py --input-dir artifacts/checkpoint-b/platforms --candidate-manifest artifacts/candidate/package-manifest.json --repository-gates artifacts/checkpoint-b/repository-gates.json --release-scope artifacts/checkpoint-b/release-scope.json --output-dir artifacts/checkpoint-b/release-evidence

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkpoint-b-release-evidence-${{ needs.prepare-candidate.outputs.package_version }}
          path: artifacts/checkpoint-b/release-evidence
          if-no-files-found: error

  prepare-candidate:
    name: Prepare immutable NuGet candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      package_version: ${{ steps.release_metadata.outputs.package_version }}
      target_tag: ${{ steps.release_metadata.outputs.target_tag }}

    env:
      PACKAGE_OUTPUT: artifacts/packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Calculate package version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          uv run --project tools --locked python tools/release/calculate_version.py \
            --release-type "$RELEASE_TYPE" \
            --version-override "$VERSION_OVERRIDE" \
            --github-env "$GITHUB_ENV"

      - name: Export release metadata outputs
        id: release_metadata
        shell: bash
        run: |
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: make restore

      - name: Repository acceptance
        run: make acceptance-repository

      - name: Validate OpenSpec strictly
        run: |
          npm ci --ignore-scripts --prefix tools/openspec
          npm exec --prefix tools/openspec --no-install -- openspec validate --all --strict

      # Repository acceptance recompiles source projects at their ordinary development version.
      # Build the candidate immediately before `--no-build` packing so the assemblies embedded in
      # each package report the manifest-bound release version rather than those test outputs.
      - name: Build release candidate
        run: dotnet build ArchLinterNet.slnx --configuration Release --no-restore -p:Version="$PACKAGE_VERSION"

      - name: Prepare NuGet package release notes
        shell: bash
        run: echo "PACKAGE_RELEASE_NOTES=See GitHub release notes for $TARGET_TAG." >> "$GITHUB_ENV"

      - name: Pack CEL
        run: dotnet pack src/ArchLinterNet.CEL/ArchLinterNet.CEL.csproj --configuration Release --no-build --output "$PACKAGE_OUTPUT" -p:PackageVersion="$PACKAGE_VERSION" -p:Version="$PACKAGE_VERSION" -p:PackageReleaseNotes="$PACKAGE_RELEASE_NOTES"

      - name: Pack Core
        run: dotnet pack src/ArchLinterNet.Core/ArchLinterNet.Core.csproj --configuration Release --no-build --output "$PACKAGE_OUTPUT" -p:PackageVersion="$PACKAGE_VERSION" -p:Version="$PACKAGE_VERSION" -p:PackageReleaseNotes="$PACKAGE_RELEASE_NOTES"

      - name: Pack CLI
        run: dotnet pack src/ArchLinterNet.Cli/ArchLinterNet.Cli.csproj --configuration Release --no-build --output "$PACKAGE_OUTPUT" -p:PackageVersion="$PACKAGE_VERSION" -p:Version="$PACKAGE_VERSION" -p:PackageReleaseNotes="$PACKAGE_RELEASE_NOTES"

      - name: Pack Testing
        run: dotnet pack src/ArchLinterNet.Testing/ArchLinterNet.Testing.csproj --configuration Release --no-build --output "$PACKAGE_OUTPUT" -p:PackageVersion="$PACKAGE_VERSION" -p:Version="$PACKAGE_VERSION" -p:PackageReleaseNotes="$PACKAGE_RELEASE_NOTES"

      - name: Create immutable candidate manifest
        run: python3 tools/release/package_manifest.py create --packages-dir "$PACKAGE_OUTPUT" --version "$PACKAGE_VERSION" --source-commit "$GITHUB_SHA" --output artifacts/packages/package-manifest.json

      - name: Render candidate package checksums
        run: python3 tools/release/package_manifest.py render-checksums --manifest artifacts/packages/package-manifest.json --output artifacts/packages/package-checksums.txt

      - name: Record passed repository gates
        run: python3 tools/release/create_repository_gate_evidence.py --candidate-manifest artifacts/packages/package-manifest.json --source-commit "$GITHUB_SHA" --output artifacts/checkpoint-b/repository-gates.json

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nuget-candidate-${{ env.PACKAGE_VERSION }}
          path: |
            ${{ env.PACKAGE_OUTPUT }}/
          if-no-files-found: error

      - name: Upload repository-gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkpoint-b-repository-gates-${{ env.PACKAGE_VERSION }}
          path: artifacts/checkpoint-b/repository-gates.json
          if-no-files-found: error

  release:
    name: Publish verified NuGet candidate
    needs: [prepare-candidate, checkpoint-b-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    outputs:
      package_version: ${{ needs.prepare-candidate.outputs.package_version }}
      target_tag: ${{ needs.prepare-candidate.outputs.target_tag }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download validated candidate packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nuget-candidate-${{ needs.prepare-candidate.outputs.package_version }}
          path: artifacts/packages

      - name: Verify candidate manifest before publication
        run: python3 tools/release/package_manifest.py verify --packages-dir artifacts/packages --manifest artifacts/packages/package-manifest.json --version "${{ needs.prepare-candidate.outputs.package_version }}" --source-commit "$GITHUB_SHA"

      - name: Generate release notes after Checkpoint B
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ needs.prepare-candidate.outputs.target_tag }}
        run: |
          mkdir -p artifacts/release-notes
          jq -n \
            --arg tag_name "$TARGET_TAG" \
            --arg target_commitish "$GITHUB_SHA" \
            --arg configuration_file_path ".github/release.yml" \
            '{ tag_name: $tag_name, target_commitish: $target_commitish, configuration_file_path: $configuration_file_path }' \
            | gh api --method POST repos/${{ github.repository }}/releases/generate-notes --input - --jq '.body' \
            | tee artifacts/release-notes/release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes-${{ needs.prepare-candidate.outputs.package_version }}
          path: artifacts/release-notes/release-notes.md
          if-no-files-found: error

      - name: NuGet login
        if: ${{ inputs.publish == true }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish verified packages to NuGet.org
        if: ${{ inputs.publish == true }}
        shell: bash
        run: |
          mapfile -t packages < <(python3 tools/release/package_manifest.py paths --packages-dir artifacts/packages --manifest artifacts/packages/package-manifest.json --kind package)
          mapfile -t symbols < <(python3 tools/release/package_manifest.py paths --packages-dir artifacts/packages --manifest artifacts/packages/package-manifest.json --kind symbols)
          test "${#packages[@]}" -eq "${#symbols[@]}"
          for index in "${!packages[@]}"; do
            test -f "artifacts/packages/${symbols[$index]}"
            dotnet nuget push "artifacts/packages/${packages[$index]}" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
          done

  create-release:
    name: Create GitHub Release
    if: ${{ inputs.publish == true }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download release notes artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-notes-${{ needs.release.outputs.package_version }}
          path: artifacts/release-notes

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nuget-candidate-${{ needs.release.outputs.package_version }}
          path: artifacts/packages

      - name: Verify release attachment subjects
        run: python3 tools/release/package_manifest.py verify --packages-dir artifacts/packages --manifest artifacts/packages/package-manifest.json --version "${{ needs.release.outputs.package_version }}" --source-commit "$GITHUB_SHA"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ needs.release.outputs.target_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mapfile -t assets < <(python3 tools/release/package_manifest.py paths --packages-dir artifacts/packages --manifest artifacts/packages/package-manifest.json --kind all)
          attachment_paths=(artifacts/packages/package-manifest.json artifacts/packages/package-checksums.txt)
          for asset in "${assets[@]}"; do
            attachment_paths+=("artifacts/packages/$asset")
          done
          gh release create "$TARGET_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "$TARGET_TAG" \
            --notes-file artifacts/release-notes/release-notes.md \
            "${attachment_paths[@]}"

  deploy-docs:
    name: Deploy GitHub Pages docs
    if: ${{ inputs.publish == true }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build docs
        run: make docs-build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
