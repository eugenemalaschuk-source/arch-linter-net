name: Task 975 read-only inspection

on:
  push:
    branches: [task/975-release-preparation]
    paths: [.github/workflows/task-975-inspection.yml]

permissions:
  contents: read
  issues: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect public version inventories and tracked source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task-975"
          git archive --format=zip --output="$RUNNER_TEMP/task-975/source.zip" HEAD
          git bundle create "$RUNNER_TEMP/task-975/repository.bundle" HEAD
          git log --format='%H %s' v0.8.0..e4af794f27f311e90602e8f032b6b7ff38738042 > "$RUNNER_TEMP/task-975/delta.txt"
          git diff --stat v0.8.0 e4af794f27f311e90602e8f032b6b7ff38738042 > "$RUNNER_TEMP/task-975/delta-stat.txt"
          git tag --list 'v*' --sort=-version:refname > "$RUNNER_TEMP/task-975/tags.txt"
          python3 tools/release/calculate_version.py --release-type patch --version-override '' --github-env "$RUNNER_TEMP/task-975/calculated-version.env"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/task-975/releases.json"
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          output = Path(os.environ["RUNNER_TEMP"]) / "task-975"
          result = {"checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "source_commit": "e4af794f27f311e90602e8f032b6b7ff38738042", "packages": {}}
          for package in ("ArchLinterNet.CEL", "ArchLinterNet.Core", "ArchLinterNet.Cli", "ArchLinterNet.Testing"):
              url = f"https://api.nuget.org/v3-flatcontainer/{package.lower()}/index.json"
              with urllib.request.urlopen(url, timeout=30) as response:
                  versions = json.load(response)["versions"]
              result["packages"][package] = {"url": url, "versions": versions, "target_0_8_1_available": "0.8.1" not in versions}
          text = json.dumps(result, indent=2) + "\n"
          (output / "nuget-versions.json").write_text(text, encoding="utf-8")
          print(text)
          issues = []
          for number in (650, 772, 783, 784, 785, 787, 788, 797, 800, 801, 806, 825, 826, 827, 828, 830, 831, 832, 833, 834, 835, 836, 849, 864, 872, 876, 913, 922, 963, 971, 973, 975, 976, 977):
              item = json.loads(subprocess.check_output(["gh", "issue", "view", str(number), "--repo", os.environ["GITHUB_REPOSITORY"], "--json", "number,state,title,closedAt,assignees,milestone"], text=True))
              issues.append(item)
              print(item["number"], item["state"], item["title"])
          (output / "prerequisites.json").write_text(json.dumps(issues, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload read-only inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: task-975-read-only-inspection
          path: ${{ runner.temp }}/task-975
          retention-days: 7
          if-no-files-found: error
