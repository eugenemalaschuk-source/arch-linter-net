name: Architecture Health Badge Promotion

on:
  workflow_call:
    inputs:
      configuration-id:
        description: Approved setup/registry entry; never an arbitrary producer selector.
        required: true
        type: string
      adapter:
        description: Approved transport adapter.
        required: true
        type: string
      operation:
        description: Bootstrap setup, publish, or metadata-only renew.
        required: false
        default: publish
        type: string
      cli-version:
        description: Exact ArchLinterNet CLI package used by the trusted bootstrap operation.
        required: false
        default: 0.8.0
        type: string
      nuget-source:
        description: Optional package source for the exact bootstrap CLI package.
        required: false
        default: https://api.nuget.org/v3/index.json
        type: string
      repository:
        description: Consumer owner/name for bootstrap setup.
        required: false
        type: string
      visibility:
        description: Consumer repository visibility for bootstrap setup.
        required: false
        default: private
        type: string
      mode:
        description: Consumer badge mode for bootstrap setup.
        required: false
        default: relay
        type: string
      account:
        description: Provider account identifier for bootstrap setup.
        required: false
        type: string
      alias:
        description: Opaque Relay alias for bootstrap setup.
        required: false
        type: string
      endpoint:
        description: Relay HTTPS origin for bootstrap setup.
        required: false
        type: string
      audience:
        description: Exact OIDC audience for bootstrap setup.
        required: false
        type: string
      provider-plan:
        description: Provider plan metadata for bootstrap setup.
        required: false
        type: string
      repository-id:
        description: Immutable consumer repository ID for bootstrap setup.
        required: false
        type: string
      repository-owner-id:
        description: Immutable consumer owner ID for bootstrap setup.
        required: false
        type: string
      base-ref:
        description: Consumer branch for bootstrap setup.
        required: false
        default: main
        type: string
      policy:
        description: Architecture policy path for bootstrap setup.
        required: false
        default: architecture/dependencies.arch.yml
        type: string
      solution:
        description: Solution path for bootstrap setup.
        required: false
        default: ArchLinterNet.slnx
        type: string
      disclosure-profile:
        description: Approved disclosure profile for bootstrap setup.
        required: false
        default: headline-only/v1
        type: string
      producer-workflow:
        description: Producer workflow path for bootstrap setup.
        required: false
        default: .github/workflows/architecture-health-badge-producer.yml
        type: string
      producer-job-name:
        description: Producer job name for bootstrap setup.
        required: false
        default: Architecture Coverage
        type: string
      check-name:
        description: Required check name for bootstrap setup.
        required: false
        default: Architecture Coverage
        type: string
      check-app:
        description: Required check provider for bootstrap setup.
        required: false
        default: GitHub Actions
        type: string
      artifact-name:
        description: Producer artifact name for bootstrap setup.
        required: false
        default: architecture-health-badge-v1
        type: string
      evidence-artifact-name:
        description: Producer semantic evidence artifact name for bootstrap setup.
        required: false
        default: architecture-health
        type: string
    secrets:
      cf_api_token:
        description: Optional Cloudflare API token used only by trusted bootstrap capability inspection.
        required: false

concurrency:
  group: architecture-health-badge-${{ inputs['configuration-id'] }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    if: inputs.operation == 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    steps:
      - name: Materialize consumer for trusted bootstrap setup
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_BASE_REF: ${{ inputs['base-ref'] }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/arch-linter-net-bootstrap-consumer"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 --branch "$BOOTSTRAP_BASE_REF" "https://github.com/${GITHUB_REPOSITORY}.git" "$root"
          base_sha="$(git -C "$root" rev-parse HEAD)"
          base_tree_sha="$(git -C "$root" rev-parse "HEAD^{tree}")"
          {
            echo "BOOTSTRAP_ROOT=$root"
            echo "BOOTSTRAP_BASE_SHA=$base_sha"
            echo "BOOTSTRAP_BASE_TREE_SHA=$base_tree_sha"
          } >> "$GITHUB_ENV"
      - name: Setup .NET for trusted bootstrap setup
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Install exact bootstrap CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ inputs['cli-version'] }}
          NUGET_SOURCE: ${{ inputs['nuget-source'] }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/arch-linter-net-bootstrap NuGet.Config"
          tool="$RUNNER_TEMP/arch-linter-net-bootstrap-tool"
          cat > "$config" <<'EOF'
          <configuration><packageSources><clear /></packageSources></configuration>
          EOF
          dotnet nuget add source "$NUGET_SOURCE" --name bootstrap --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile "$config"
          dotnet tool install ArchLinterNet.Cli --tool-path "$tool" --version "$CLI_VERSION" --configfile "$config"
          echo "BOOTSTRAP_TOOL=$tool/arch-linter-net" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_NUGET_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Generate private trusted bootstrap handoff
        shell: bash
        env:
          ARCHLINTERNET_BOOTSTRAP: "1"
          GITHUB_TOKEN: ${{ github.token }}
          CF_API_TOKEN: ${{ secrets['cf_api_token'] }}
          BOOTSTRAP_REPOSITORY: ${{ inputs.repository }}
          BOOTSTRAP_VISIBILITY: ${{ inputs.visibility }}
          BOOTSTRAP_MODE: ${{ inputs.mode }}
          BOOTSTRAP_ACCOUNT: ${{ inputs.account }}
          BOOTSTRAP_ALIAS: ${{ inputs.alias }}
          BOOTSTRAP_ENDPOINT: ${{ inputs.endpoint }}
          BOOTSTRAP_AUDIENCE: ${{ inputs.audience }}
          BOOTSTRAP_PROVIDER_PLAN: ${{ inputs['provider-plan'] }}
          BOOTSTRAP_REPOSITORY_ID: ${{ inputs['repository-id'] }}
          BOOTSTRAP_REPOSITORY_OWNER_ID: ${{ inputs['repository-owner-id'] }}
          BOOTSTRAP_BASE_REF: ${{ inputs['base-ref'] }}
          BOOTSTRAP_POLICY: ${{ inputs.policy }}
          BOOTSTRAP_SOLUTION: ${{ inputs.solution }}
          BOOTSTRAP_DISCLOSURE_PROFILE: ${{ inputs['disclosure-profile'] }}
          BOOTSTRAP_PRODUCER_WORKFLOW: ${{ inputs['producer-workflow'] }}
          BOOTSTRAP_PRODUCER_JOB: ${{ inputs['producer-job-name'] }}
          BOOTSTRAP_CHECK_NAME: ${{ inputs['check-name'] }}
          BOOTSTRAP_CHECK_APP: ${{ inputs['check-app'] }}
          BOOTSTRAP_ARTIFACT: ${{ inputs['artifact-name'] }}
          BOOTSTRAP_EVIDENCE_ARTIFACT: ${{ inputs['evidence-artifact-name'] }}
          BOOTSTRAP_BASE_SHA: ${{ env.BOOTSTRAP_BASE_SHA }}
          BOOTSTRAP_BASE_TREE_SHA: ${{ env.BOOTSTRAP_BASE_TREE_SHA }}
        run: |
          set -euo pipefail
          cd "$BOOTSTRAP_ROOT"
          args=(badge architecture-health setup
            --repository "$BOOTSTRAP_REPOSITORY"
            --visibility "$BOOTSTRAP_VISIBILITY"
            --mode "$BOOTSTRAP_MODE"
            --account "$BOOTSTRAP_ACCOUNT"
            --alias "$BOOTSTRAP_ALIAS"
            --endpoint "$BOOTSTRAP_ENDPOINT"
            --audience "$BOOTSTRAP_AUDIENCE"
            --provider-plan "$BOOTSTRAP_PROVIDER_PLAN"
            --repository-id "$BOOTSTRAP_REPOSITORY_ID"
            --repository-owner-id "$BOOTSTRAP_REPOSITORY_OWNER_ID"
            --base-ref "$BOOTSTRAP_BASE_REF"
            --policy "$BOOTSTRAP_POLICY"
            --solution "$BOOTSTRAP_SOLUTION"
            --disclosure-profile "$BOOTSTRAP_DISCLOSURE_PROFILE"
            --producer-workflow "$BOOTSTRAP_PRODUCER_WORKFLOW"
            --producer-job-name "$BOOTSTRAP_PRODUCER_JOB"
            --check-name "$BOOTSTRAP_CHECK_NAME"
            --check-app "$BOOTSTRAP_CHECK_APP"
            --artifact-name "$BOOTSTRAP_ARTIFACT"
            --evidence-artifact-name "$BOOTSTRAP_EVIDENCE_ARTIFACT"
            --approve-disclosure --output . --format human)
          "$BOOTSTRAP_TOOL" "${args[@]}"
          handoff="$RUNNER_TEMP/arch-linter-net-bootstrap-handoff"
          payload="$handoff/payload"
          mkdir -p "$payload"
          mapfile -d '' -t changed_files < <(
            {
              git diff --name-only -z
              git ls-files --others --exclude-standard -z
            } | LC_ALL=C sort -z -u
          )
          for path in "${changed_files[@]}"; do
            case "$path" in
              badge-relay-config.json|README.md|relay/*|schema/*|.github/badge-promotion/*|.github/workflows/architecture-health-badge-*) ;;
              *) echo "::error::Trusted bootstrap produced output outside its managed allowlist."; exit 1 ;;
            esac
            if [[ -L "$path" || ! -f "$path" ]]; then
              echo "::error::Trusted bootstrap produced an unsafe managed output entry."
              exit 1
            fi
            mkdir -p "$payload/$(dirname "$path")"
            cp -- "$path" "$payload/$path"
          done
          export HANDOFF_ROOT="$handoff"
          export HANDOFF_PAYLOAD="$payload"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["HANDOFF_ROOT"])
          payload = Path(os.environ["HANDOFF_PAYLOAD"])
          config_path = payload / "badge-relay-config.json"
          if not config_path.is_file():
              raise SystemExit("::error::Trusted bootstrap handoff is missing its generated configuration.")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          repository = config.get("repository")
          pins = config.get("pins")
          if not isinstance(repository, dict) or not isinstance(pins, dict):
              raise SystemExit("::error::Trusted bootstrap handoff generated malformed configuration.")
          files = []
          for path in sorted(payload.rglob("*")):
              if path.is_dir():
                  continue
              if path.is_symlink():
                  raise SystemExit("::error::Trusted bootstrap handoff contains an unsafe payload entry.")
              relative = path.relative_to(payload).as_posix()
              contents = path.read_bytes()
              contents.decode("utf-8")
              files.append({
                  "path": relative,
                  "bytes": len(contents),
                  "sha256": hashlib.sha256(contents).hexdigest(),
              })
          manifest = {
              "schema": "architecture-health-badge-bootstrap-handoff/v1",
              "base": {
                  "ref": os.environ["BOOTSTRAP_BASE_REF"],
                  "sha": os.environ["BOOTSTRAP_BASE_SHA"],
                  "tree_sha": os.environ["BOOTSTRAP_BASE_TREE_SHA"],
              },
              "repository": repository,
              "publisher": pins,
              "configuration": {
                  "schema_id": config.get("schema_id"),
                  "contract_version": config.get("contract_version"),
                  "mode": config.get("mode"),
                  "disclosure_profile": config.get("disclosure_profile"),
              },
              "files": files,
          }
          (root / "bootstrap-handoff.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          cat > "$handoff/OWNER-APPLY-HANDOFF.md" <<'EOF'
          # Apply the private bootstrap handoff

          Keep this artifact private. Create a normal local review branch at the exact
          `base.sha` and `base.tree_sha` in `bootstrap-handoff.json`. Before making any
          commit, run the installed package's `badge architecture-health apply-handoff`
          command with this manifest, its `payload` directory, the local repository root,
          and the matching base and repository identity values from the manifest. Review
          the resulting local diff, then use the repository's ordinary protected-branch
          pull request process. This artifact does not authorize a direct base-branch write.
          EOF
      - name: Upload private trusted bootstrap handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-health-bootstrap-handoff
          path: ${{ runner.temp }}/arch-linter-net-bootstrap-handoff
          # The validated payload contains managed .github workflows and registry files.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  promote:
    if: inputs.operation != 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      packages: read
      pull-requests: read
    steps:
      - name: Set up .NET for trusted temporal revalidation
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Run pinned trusted promotion contract
        id: promotion
        uses: eugenemalaschuk-source/arch-linter-net/.github/actions/architecture-health-badge-promotion@68c69f51ea4ea6a5ae2cca2a09479be99ae3501d
        with:
          configuration_id: ${{ inputs['configuration-id'] }}
          adapter: ${{ inputs.adapter }}
          operation: ${{ inputs.operation }}
      - name: Publish Source lines payload from canonical evidence
        if: steps.promotion.outputs.status == 'ready' && inputs.adapter == 'github-raw'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ steps.promotion.outputs.run-id }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/architecture-health-evidence.zip"
          payload="$RUNNER_TEMP/repository-metrics.json"
          artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "architecture-health" and .expired != true)] | if length == 1 then .[0].id else error("expected exactly one canonical Architecture Health evidence artifact") end')"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
          python3 - "$archive" "$payload" <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          archive_path = Path(sys.argv[1])
          payload_path = Path(sys.argv[2])
          with zipfile.ZipFile(archive_path) as opened:
              try:
                  member = opened.getinfo("repository-metrics-badge.json")
              except KeyError as error:
                  raise SystemExit("canonical evidence is missing repository-metrics-badge.json") from error
              if member.file_size > 16_384 or member.compress_size > 16_384:
                  raise SystemExit("repository-metrics-badge.json exceeds the reviewed member limit")
              raw = opened.read(member)

          try:
              document = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"repository metrics badge is not valid JSON: {error}") from error
          if (
              not isinstance(document, dict)
              or set(document) != {"schemaVersion", "label", "message", "color"}
              or document.get("schemaVersion") != 1
              or document.get("label") != "source lines"
              or not all(isinstance(document.get(key), str) and document[key] for key in ("message", "color"))
          ):
              raise SystemExit("repository metrics badge is not a complete Shields endpoint document")
          payload_path.write_bytes(raw)
          PY

          blob_input="$RUNNER_TEMP/repository-metrics-blob.json"
          tree_input="$RUNNER_TEMP/repository-metrics-tree.json"
          commit_input="$RUNNER_TEMP/repository-metrics-commit.json"
          ref_input="$RUNNER_TEMP/repository-metrics-ref.json"
          for attempt in 1 2 3; do
            parent_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/architecture-health-badge" --jq '.object.sha')"
            base_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$parent_sha" --jq '.tree.sha')"
            python3 - "$payload" "$blob_input" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[2]).write_text(
              json.dumps({"content": base64.b64encode(Path(sys.argv[1]).read_bytes()).decode("ascii"), "encoding": "base64"}),
              encoding="utf-8",
          )
          PY
            blob_sha="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/blobs" --input "$blob_input" --jq '.sha')"
            python3 - "$base_tree" "$blob_sha" "$tree_input" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[3]).write_text(
              json.dumps({
                  "base_tree": sys.argv[1],
                  "tree": [{"path": "repository-metrics.json", "mode": "100644", "type": "blob", "sha": sys.argv[2]}],
              }),
              encoding="utf-8",
          )
          PY
            tree_sha="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/trees" --input "$tree_input" --jq '.sha')"
            python3 - "$tree_sha" "$parent_sha" "$commit_input" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[3]).write_text(
              json.dumps({
                  "message": "chore: publish repository metrics badge",
                  "tree": sys.argv[1],
                  "parents": [sys.argv[2]],
              }),
              encoding="utf-8",
          )
          PY
            commit_sha="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/commits" --input "$commit_input" --jq '.sha')"
            python3 - "$commit_sha" "$ref_input" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[2]).write_text(
              json.dumps({"sha": sys.argv[1], "force": False}),
              encoding="utf-8",
          )
          PY
            if gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/heads/architecture-health-badge" --input "$ref_input" >/dev/null; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Could not publish repository-metrics.json without losing the raw-branch CAS race." >&2
          exit 1
      - name: Confirm actionable promotion result
        if: always()
        env:
          STATUS: ${{ steps.promotion.outputs.status }}
          REASON: ${{ steps.promotion.outputs.reason }}
        run: |
          case "$STATUS" in
            ready|private)
              echo "Architecture Health promotion: $STATUS"
              ;;
            *)
              echo "Architecture Health promotion unavailable: ${REASON:-unknown}" >&2
              exit 1
              ;;
          esac
