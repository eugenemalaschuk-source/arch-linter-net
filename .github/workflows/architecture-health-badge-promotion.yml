name: Architecture Health Badge Promotion

on:
  workflow_call:
    inputs:
      configuration-id:
        description: Approved setup/registry entry; never an arbitrary producer selector.
        required: true
        type: string
      adapter:
        description: Approved transport adapter.
        required: true
        type: string
      operation:
        description: Publish or metadata-only renew.
        required: false
        default: publish
        type: string

concurrency:
  group: architecture-health-badge-${{ inputs.configuration-id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Run pinned trusted promotion contract
        id: promotion
        uses: $/.github/actions/architecture-health-badge-promotion
        with:
          configuration-id: ${{ inputs.configuration-id }}
          adapter: ${{ inputs.adapter }}
          operation: ${{ inputs.operation }}
      - name: Confirm actionable promotion result
        if: always()
        env:
          STATUS: ${{ steps.promotion.outputs.status }}
          REASON: ${{ steps.promotion.outputs.reason }}
        run: |
          case "$STATUS" in
            ready|private)
              echo "Architecture Health promotion: $STATUS"
              ;;
            *)
              echo "Architecture Health promotion unavailable: ${REASON:-unknown}" >&2
              exit 1
              ;;
          esac
