name: Qodana Community

on:
  pull_request:
  workflow_dispatch:
    inputs:
      burn_in:
        description: Run cold/warm comparison and positive/negative inspection probes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qodana-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Qodana evidence and workflow contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Test Qodana evidence and workflow contracts
        run: python3 -m unittest discover -s tests/qodana -v

  qodana:
    name: Qodana Community .NET (scan)
    needs: contracts
    runs-on: ubuntu-24.04
    # A PR compares bounded base/head scans. Opt-in burn-in uses a warm run and tiny probes.
    timeout-minutes: 55
    permissions:
      contents: read
    # Intentionally NOT required. Keep infrastructure failures visible rather than
    # converting them to success with continue-on-error. No other job depends on this one.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false

      - name: Checkout exact pull request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Install the locked .NET SDK for the scanner container
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: source/global.json

      - name: Export the SDK root for a read-only scanner mount
        shell: bash
        run: |
          set -euo pipefail
          dotnet_root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          sdk_version="$(jq -r '.sdk.version' source/global.json)"
          if [[ ! -d "$dotnet_root/sdk/$sdk_version" ]]; then
            echo "The locked SDK $sdk_version is missing from $dotnet_root." >&2
            exit 1
          fi
          printf 'QODANA_DOTNET_ROOT=%s\n' "$dotnet_root" >> "$GITHUB_ENV"

      - name: Analyze canonical solution without secrets
        working-directory: source
        env:
          BURN_IN: ${{ inputs.burn_in || false }}
        shell: bash
        run: |
          export QODANA_ANALYZED_SHA
          QODANA_ANALYZED_SHA="$(git rev-parse HEAD)"
          export QODANA_PULL_REQUEST_NUMBER='${{ github.event.pull_request.number || '' }}'
          export QODANA_HEAD_SHA='${{ github.event.pull_request.head.sha || '' }}'
          export QODANA_BASE_SHA='${{ github.event.pull_request.base.sha || '' }}'
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            export QODANA_BASE_ANALYZED_SHA
            QODANA_BASE_ANALYZED_SHA="$(git -C "$GITHUB_WORKSPACE/base" rev-parse HEAD)"
            args+=(--base-project "$GITHUB_WORKSPACE/base")
          fi
          if [[ "$BURN_IN" == "true" ]]; then
            args+=(--burn-in)
          fi
          python3 -I tools/scripts/qodana_ci.py \
            --output "$RUNNER_TEMP/qodana" "${args[@]}"

      - name: Upload Qodana evidence (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qodana-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qodana/artifacts
          if-no-files-found: error
          retention-days: 14
