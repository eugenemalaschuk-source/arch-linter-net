name: Qodana Community

on:
  pull_request:
  workflow_dispatch:
    inputs:
      burn_in:
        description: Run cold/warm comparison and positive/negative inspection probes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qodana-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana Community .NET (advisory)
    runs-on: ubuntu-24.04
    # A normal PR does one bounded scan. Opt-in burn-in adds a warm run and tiny probes.
    timeout-minutes: 55
    permissions:
      contents: read
    # Intentionally NOT required. Keep infrastructure failures visible rather than
    # converting them to success with continue-on-error. No other job depends on this one.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the locked .NET SDK for the scanner container
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Export the SDK root for a read-only scanner mount
        shell: bash
        run: |
          set -euo pipefail
          dotnet_root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          sdk_version="$(jq -r '.sdk.version' global.json)"
          if [[ ! -d "$dotnet_root/sdk/$sdk_version" ]]; then
            echo "The locked SDK $sdk_version is missing from $dotnet_root." >&2
            exit 1
          fi
          printf 'QODANA_DOTNET_ROOT=%s\n' "$dotnet_root" >> "$GITHUB_ENV"

      - name: Test Qodana evidence and workflow contracts
        run: python3 -m unittest discover -s tests/qodana -v

      - name: Analyze canonical solution without secrets
        env:
          BURN_IN: ${{ inputs.burn_in || false }}
        shell: bash
        run: |
          export QODANA_ANALYZED_SHA
          QODANA_ANALYZED_SHA="$(git rev-parse HEAD)"
          args=()
          if [[ "$BURN_IN" == "true" ]]; then
            args+=(--burn-in)
          fi
          python3 tools/scripts/qodana_ci.py \
            --output "$RUNNER_TEMP/qodana" "${args[@]}"

      - name: Upload Qodana evidence (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qodana-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qodana/artifacts
          if-no-files-found: error
          retention-days: 14
