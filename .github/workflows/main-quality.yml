name: Main Quality Telemetry

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'eugenemalaschuk-source_arch-linter-net' }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'eugenemalaschuk-source' }}

jobs:
  dotnet_coverage:
    name: Main .NET Coverage (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core-1
            name: Core Shard 1
            target: test-coverage-core-1
          - id: core-2
            name: Core Shard 2
            target: test-coverage-core-2
          - id: other
            name: CEL + CLI
            target: test-coverage-other
    permissions:
      contents: read
    env:
      TEST_COVERAGE_DIAGNOSTICS: --blame-hang --blame-hang-timeout 5m

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Collect ${{ matrix.name }} coverage
        shell: bash
        run: make ${{ matrix.target }}

      - name: Canonicalize coverage shard evidence
        shell: bash
        run: |
          python3 tools/release/main_quality_coverage.py canonicalize-shard \
            --shard "${{ matrix.id }}" \
            --source-sha "$GITHUB_SHA" \
            --coverage-root "test-results/coverage/${{ matrix.id }}" \
            --output-root test-results/main-quality-shard

      - name: Upload canonical .NET coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-dotnet-coverage-${{ matrix.id }}
          path: |
            test-results/main-quality-shard
            test-results/coverage
          if-no-files-found: error
          retention-days: 1

  coverage_inventory:
    name: Main Coverage Evidence
    needs: dotnet_coverage
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.coverage_inventory.outputs.source_sha }}
      shard_count: ${{ steps.coverage_inventory.outputs.shard_count }}
      expected_shard_count: ${{ steps.coverage_inventory.outputs.expected_shard_count }}
      opencover_count: ${{ steps.coverage_inventory.outputs.opencover_count }}
      cobertura_count: ${{ steps.coverage_inventory.outputs.cobertura_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download canonical .NET coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: main-dotnet-coverage-*
          path: test-results/coverage-shards

      - name: Assemble and verify complete coverage inventory
        id: coverage_inventory
        shell: bash
        run: |
          python3 tools/release/main_quality_coverage.py assemble \
            --artifacts-root test-results/coverage-shards \
            --expected-sha "$GITHUB_SHA" \
            --output-root test-results/main-quality-canonical \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload complete canonical coverage inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-dotnet-coverage-canonical
          path: test-results/main-quality-canonical
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: Main SonarCloud
    needs: coverage_inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      quality_gate: ${{ steps.sonar_end.outputs.quality_gate }}
      analysis_revision: ${{ steps.sonar_evidence.outputs.analysis_revision }}
      coverage_import_status: ${{ steps.sonar_evidence.outputs.coverage_import_status }}
      covered_main_files: ${{ steps.sonar_evidence.outputs.covered_main_files }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download complete canonical coverage inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: main-dotnet-coverage-canonical
          path: test-results/main-quality-canonical

      - name: Download .NET test execution reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: main-dotnet-coverage-*
          path: test-results/test-execution-shards

      - name: Verify canonical coverage inventory
        id: coverage_evidence
        shell: bash
        run: |
          python3 tools/release/main_quality_coverage.py verify-inventory \
            --inventory-root test-results/main-quality-canonical \
            --expected-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: make restore

      - name: Collect Python tooling coverage
        run: make test-tooling-coverage

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Validate SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          missing=()
          [[ -n "$SONAR_TOKEN" ]] || missing+=("SONAR_TOKEN secret")
          [[ -n "$SONAR_PROJECT_KEY" ]] || missing+=("SONAR_PROJECT_KEY repository variable or committed default")
          [[ -n "$SONAR_ORGANIZATION" ]] || missing+=("SONAR_ORGANIZATION repository variable or committed default")
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing SonarCloud configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Begin SonarCloud analysis
        id: sonar_begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          OPENCOVER_FILES: ${{ steps.coverage_evidence.outputs.opencover_files }}
        shell: bash
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.scm.revision="$GITHUB_SHA" \
            /d:sonar.cs.opencover.reportsPaths="$OPENCOVER_FILES" \
            /d:sonar.cs.vstest.reportsPaths="test-results/test-execution-shards/**/*.trx" \
            /d:sonar.python.coverage.reportPaths="coverage-python.xml" \
            /d:sonar.exclusions="**/AdoptionAcceptance/Fixtures/**" \
            /d:sonar.coverage.exclusions="tools/ArchLinterNet.GitFuzz/**,tools/ArchLinterNet.ProcessTreeProbe/**,tools/**/tests/**,**/CheckpointBReleaseGateTests*.cs"

      - name: Build for SonarCloud analysis
        run: dotnet build ArchLinterNet.slnx --no-restore --nologo

      - name: End SonarCloud analysis and record quality gate
        id: sonar_end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/sonar-end.log"

          set +e
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN" 2>&1 | tee "$log"
          scanner_status="${PIPESTATUS[0]}"
          set -e

          quality_gate=unknown
          if grep -Fq "QUALITY GATE STATUS: FAILED" "$log"; then
            quality_gate=failed
          elif grep -Eq "QUALITY GATE STATUS: (PASSED|OK)" "$log"; then
            quality_gate=passed
          fi
          echo "quality_gate=$quality_gate" >> "$GITHUB_OUTPUT"

          if [ "$quality_gate" = failed ]; then
            echo "::warning title=SonarCloud quality gate::Merged-main analysis was uploaded, but the SonarCloud quality gate is FAILED. PR checks remain the merge authority; review the SonarCloud dashboard for debt."
            exit 0
          fi

          if [ "$scanner_status" -ne 0 ]; then
            exit "$scanner_status"
          fi

          if [ "$quality_gate" = unknown ]; then
            echo "SonarCloud analysis completed without a recognizable quality-gate status." >&2
            exit 1
          fi

      - name: Verify SonarCloud coverage import and revision
        id: sonar_evidence
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          analysis_json="$RUNNER_TEMP/sonar-project-analyses.json"
          curl --silent --show-error --fail \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $SONAR_TOKEN" \
            --get "$SONAR_HOST_URL/api/project_analyses/search" \
            --data-urlencode "project=$SONAR_PROJECT_KEY" \
            --data-urlencode "branch=main" \
            --data-urlencode "ps=20" \
            > "$analysis_json"
          python3 tools/release/main_quality_coverage.py verify-sonar \
            --inventory-root test-results/main-quality-canonical \
            --expected-sha "$GITHUB_SHA" \
            --scanner-log "$RUNNER_TEMP/sonar-end.log" \
            --analysis-json "$analysis_json" \
            --github-output "$GITHUB_OUTPUT"

  codecov:
    name: Main Codecov
    needs: coverage_inventory
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      upload_status: ${{ steps.codecov_evidence.outputs.upload_status }}
      commit: ${{ steps.codecov_evidence.outputs.commit }}
      report_count: ${{ steps.codecov_evidence.outputs.report_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download complete canonical coverage inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: main-dotnet-coverage-canonical
          path: test-results/main-quality-canonical

      - name: Verify canonical coverage inventory
        id: coverage_evidence
        shell: bash
        run: |
          python3 tools/release/main_quality_coverage.py verify-inventory \
            --inventory-root test-results/main-quality-canonical \
            --expected-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload merged-main coverage to Codecov
        id: codecov_upload
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_evidence.outputs.cobertura_files }}
          disable_search: true
          fail_ci_if_error: true
          override_commit: ${{ github.sha }}
          name: main-quality-${{ github.run_id }}-${{ github.run_attempt }}
          verbose: true

      - name: Record Codecov commit-bound upload evidence
        id: codecov_evidence
        env:
          REPORT_COUNT: ${{ steps.coverage_evidence.outputs.cobertura_count }}
        shell: bash
        run: |
          echo "upload_status=uploaded" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "report_count=$REPORT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Codecov accepted explicit canonical coverage input: commit=$GITHUB_SHA reports=$REPORT_COUNT disable_search=true"

  summary:
    name: Main Quality Summary
    needs: [dotnet_coverage, coverage_inventory, sonar, codecov]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Publish main telemetry summary
        env:
          COVERAGE_SOURCE_SHA: ${{ needs.coverage_inventory.outputs.source_sha }}
          COVERAGE_SHARDS: ${{ needs.coverage_inventory.outputs.shard_count }}
          COVERAGE_EXPECTED_SHARDS: ${{ needs.coverage_inventory.outputs.expected_shard_count }}
          OPENCOVER_COUNT: ${{ needs.coverage_inventory.outputs.opencover_count }}
          COBERTURA_COUNT: ${{ needs.coverage_inventory.outputs.cobertura_count }}
          SONAR_QUALITY_GATE: ${{ needs.sonar.outputs.quality_gate }}
          SONAR_REVISION: ${{ needs.sonar.outputs.analysis_revision }}
          SONAR_IMPORT_STATUS: ${{ needs.sonar.outputs.coverage_import_status }}
          SONAR_COVERED_MAIN_FILES: ${{ needs.sonar.outputs.covered_main_files }}
          CODECOV_UPLOAD_STATUS: ${{ needs.codecov.outputs.upload_status }}
          CODECOV_COMMIT: ${{ needs.codecov.outputs.commit }}
          CODECOV_REPORT_COUNT: ${{ needs.codecov.outputs.report_count }}
        shell: bash
        run: |
          source_sha="${COVERAGE_SOURCE_SHA:-unavailable}"
          shards="${COVERAGE_SHARDS:-0}/${COVERAGE_EXPECTED_SHARDS:-3}"
          opencover="${OPENCOVER_COUNT:-0}"
          cobertura="${COBERTURA_COUNT:-0}"
          quality_gate="${SONAR_QUALITY_GATE:-unavailable}"
          sonar_revision="${SONAR_REVISION:-unavailable}"
          sonar_import="${SONAR_IMPORT_STATUS:-unavailable}"
          sonar_main_files="${SONAR_COVERED_MAIN_FILES:-0}"
          codecov_status="${CODECOV_UPLOAD_STATUS:-unavailable}"
          codecov_commit="${CODECOV_COMMIT:-unavailable}"
          codecov_reports="${CODECOV_REPORT_COUNT:-0}"
          {
            echo "### Main quality telemetry"
            echo
            echo "- Workflow source SHA: \`$GITHUB_SHA\`"
            echo "- Coverage evidence SHA: \`$source_sha\`"
            echo "- Required .NET coverage shards: $shards"
            echo "- Canonical OpenCover reports: $opencover"
            echo "- Canonical Cobertura reports: $cobertura"
            echo "- Coverage inventory gate: ${{ needs.coverage_inventory.result }}"
            echo "- SonarCloud main refresh: ${{ needs.sonar.result }}"
            echo "- SonarCloud analysis revision: \`$sonar_revision\`"
            echo "- SonarCloud .NET coverage import: $sonar_import (covered main files: $sonar_main_files)"
            echo "- SonarCloud quality gate (telemetry only): $quality_gate"
            echo "- Codecov main refresh: ${{ needs.codecov.result }}"
            echo "- Codecov commit/upload: $codecov_status for \`$codecov_commit\` with $codecov_reports canonical reports"
            echo "- SonarCloud and Codecov fan out independently only after the same commit-bound 3/3 coverage inventory is verified."
            echo "- An explicit processed Sonar quality-gate failure is surfaced as a warning and badge/dashboard signal; scanner, coverage import, revision, upload, processing and configuration failures remain red."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require complete main telemetry
        if: needs.dotnet_coverage.result != 'success' || needs.coverage_inventory.result != 'success' || needs.sonar.result != 'success' || needs.codecov.result != 'success'
        run: exit 1
