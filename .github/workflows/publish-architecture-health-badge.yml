name: Publish Architecture Health Badge

on:
  push:
    branches: [main]

concurrency:
  group: architecture-health-badge-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/architecture-health-badge-promotion.yml # zizmor: ignore[self-repository] — pinned candidate for this reference repository.
    with:
      configuration-id: reference-public-raw
      adapter: github-raw
      operation: publish
