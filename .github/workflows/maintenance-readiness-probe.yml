name: Maintenance metadata boundary validation

on:
  push:
    branches: [chore/975-maintenance-release-readiness]
    paths: [.github/workflows/maintenance-readiness-probe.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'eugenemalaschuk-source/arch-linter-net' && github.ref == 'refs/heads/chore/975-maintenance-release-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Check actual MSBuild property parsing without restore or publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/metadata-975
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          root = Path('/tmp/metadata-975')
          project = root / 'Metadata.proj'
          project.write_text('<Project><Target Name="Pack"><WriteLinesToFile File="$(OutputFile)" Lines="$(PackageReleaseNotes)" Overwrite="true" /></Target></Project>')
          cases = {
              'semicolon': 'Private Relay is experimental / opt-in; full hosted/lifecycle acceptance is pending.',
              'comma': 'Relay code and assets are included, but full hosted/lifecycle acceptance is pending.',
              'plain': 'Private Relay is experimental and opt-in. Full hosted/lifecycle acceptance is pending. Private default is none.',
              'escaped': 'Private Relay is experimental / opt-in%3B full hosted/lifecycle acceptance is pending%2C adopter-owned infrastructure is required.',
          }
          results = {}
          for name, value in cases.items():
              output = root / f'{name}.txt'
              run = subprocess.run(['dotnet', 'msbuild', str(project), '-nologo', '-t:Pack', f'-p:OutputFile={output}', f'-p:PackageReleaseNotes={value}'], text=True, capture_output=True)
              results[name] = {'returncode': run.returncode, 'stdout': run.stdout, 'stderr': run.stderr, 'output': output.read_text() if output.exists() else None}
          (root / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
          assert results['plain']['returncode'] == 0
          assert results['plain']['output'].strip() == cases['plain']
          assert results['escaped']['returncode'] == 0
          assert results['semicolon']['returncode'] != 0
          assert results['comma']['returncode'] != 0
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: maintenance-metadata-boundary
          path: /tmp/metadata-975/
          retention-days: 7
          if-no-files-found: error
