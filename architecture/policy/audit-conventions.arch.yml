# yaml-language-server: $schema=../schema/dependencies.arch.fragment.schema.json
#
# This fragment keeps remaining convention debt in audit mode while strict leaf and folder-purity
# rules protect the conventions whose production migration has completed.
contracts:
  strict_allow_only:
    - name: models-have-no-first-party-dependencies
      id: models-have-no-first-party-dependencies
      source: model_types
      allowed: []
      reason: Models are the innermost domain representation and must not depend on another first-party namespace.

    - name: exceptions-have-no-first-party-dependencies
      id: exceptions-have-no-first-party-dependencies
      source: exception_types
      allowed: []
      reason: Exception types must be self-contained; System.Exception is a BCL base type and is intentionally outside first-party dependency checking.

  strict_layout_conventions:
    - name: abstractions-directories-contain-only-interfaces-or-abstract-classes
      id: abstractions-directories-contain-only-interfaces-or-abstract-classes
      files_matching:
        folder_segment: Abstractions
      all_declarations:
        allowed_type_kinds: [interface, class]
        require_abstract_classes: true
      reason: "An Abstractions directory is a published contract surface: interfaces are allowed, and classes must be explicitly abstract extension points."

    - name: exceptions-directories-contain-only-exceptions
      id: exceptions-directories-contain-only-exception-classes
      files_matching:
        folder_segment: Exceptions
      all_declarations:
        allowed_roles: [Exception]
      reason: Exceptions directories contain only types classified by inheritance as Exception.

    # #742 ratchet: production-types-have-one-source-declaration (below, in audit_layout_conventions)
    # stays audit-only and keeps reporting the complete debt inventory that decompose-god-classes
    # targets. This strict rule reuses the same max_declarations_per_type evidence to block any
    # *new* or *grown* handwritten production partial aggregate immediately, while the
    # ignored_violations entries below freeze today's 17 known aggregates as reviewed debt using
    # their exact current declaration count and file list. Any added, removed, or renamed
    # declaration changes that exact text, so a frozen entry only tolerates an unchanged aggregate;
    # growth, a new offender, or an improvement all surface as a failing (or newly unmatched, itself
    # failing) finding that requires a reviewed one-line policy update in the same change.
    - name: production-partial-type-declaration-count-does-not-increase
      id: production-partial-type-declaration-count-does-not-increase
      files_matching:
        folder_segment: src
      max_declarations_per_type: 1
      reason: New or grown handwritten production partial-type aggregates are blocked immediately; see #742 and the decompose-god-classes OpenSpec change for the full cleanup authority.
      ignored_violations:
        - source_type: "ArchLinterNet.Core.Graph.ArchitectureGraphApplicationService"
          forbidden_reference: "expected at most 1 source declaration(s), found 2: src/ArchLinterNet.Core/Graph/ArchitectureGraphApplicationService.BuildState.cs, src/ArchLinterNet.Core/Graph/ArchitectureGraphApplicationService.cs"
          reason: "Reviewed decompose-god-classes debt frozen by #742; decompose-god-classes owns removing this aggregate."
        - source_type: "ArchLinterNet.Core.Validation.ArchitectureBaselineApplicationService"
          forbidden_reference: "expected at most 1 source declaration(s), found 2: src/ArchLinterNet.Core/Validation/ArchitectureBaselineApplicationService.BuildState.cs, src/ArchLinterNet.Core/Validation/ArchitectureBaselineApplicationService.cs"
          reason: "Reviewed decompose-god-classes debt frozen by #742; decompose-god-classes owns removing this aggregate."
        - source_type: "ArchLinterNet.Core.Validation.ArchitecturePublicApiApplicationService"
          forbidden_reference: "expected at most 1 source declaration(s), found 2: src/ArchLinterNet.Core/Validation/ArchitecturePublicApiApplicationService.SurfaceResolution.cs, src/ArchLinterNet.Core/Validation/ArchitecturePublicApiApplicationService.cs"
          reason: "Reviewed decompose-god-classes debt frozen by #742; decompose-god-classes owns removing this aggregate."

  audit_layout_conventions:
    - name: production-types-have-one-source-declaration
      id: production-types-have-one-source-declaration
      files_matching:
        folder_segment: src
      max_declarations_per_type: 1
      reason: A production type must have one source declaration; extract collaborators instead of extending a type through partial files.

    - name: production-interfaces-live-in-abstractions
      id: production-interfaces-live-in-abstractions
      files_matching:
        folder_segment: src
      exclude_files_matching:
        - folder_segment: Abstractions
      forbid_type_kind: interface
      reason: Every production interface is an abstraction and must be declared in an Abstractions directory.

    - name: models-live-in-models-directories-class
      id: models-live-in-models-directories-class
      files_matching:
        folder_segment: src
        when: subject.role == 'Model'
      exclude_files_matching:
        - folder_segment: Models
      forbid_type_kind: class
      reason: Model classes must be declared under a Models directory.

    - name: models-live-in-models-directories-record
      id: models-live-in-models-directories-record
      files_matching:
        folder_segment: src
        when: subject.role == 'Model'
      exclude_files_matching:
        - folder_segment: Models
      forbid_type_kind: record
      reason: Model records must be declared under a Models directory.

    - name: models-live-in-models-directories-struct
      id: models-live-in-models-directories-struct
      files_matching:
        folder_segment: src
        when: subject.role == 'Model'
      exclude_files_matching:
        - folder_segment: Models
      forbid_type_kind: struct
      reason: Model structs must be declared under a Models directory.

    - name: models-live-in-models-directories-enum
      id: models-live-in-models-directories-enum
      files_matching:
        folder_segment: src
        when: subject.role == 'Model'
      exclude_files_matching:
        - folder_segment: Models
      forbid_type_kind: enum
      reason: Model enums must be declared under a Models directory.

    - name: models-live-in-models-directories-interface
      id: models-live-in-models-directories-interface
      files_matching:
        folder_segment: src
        when: subject.role == 'Model'
      exclude_files_matching:
        - folder_segment: Models
      forbid_type_kind: interface
      reason: Model interfaces must be declared under a Models directory.

    - name: models-live-in-models-directories-delegate
      id: models-live-in-models-directories-delegate
      files_matching:
        folder_segment: src
        when: subject.role == 'Model'
      exclude_files_matching:
        - folder_segment: Models
      forbid_type_kind: delegate
      reason: Model delegates must be declared under a Models directory.

    - name: exceptions-live-in-exceptions-directories
      id: exceptions-live-in-exceptions-directories
      files_matching:
        folder_segment: src
        when: subject.role == 'Exception'
      exclude_files_matching:
        - folder_segment: Exceptions
      forbid_type_kind: class
      reason: A class derived from System.Exception must be declared under an Exceptions directory.
