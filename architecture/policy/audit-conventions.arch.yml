# yaml-language-server: $schema=../schema/dependencies.arch.fragment.schema.json
#
# This fragment keeps remaining convention debt in audit mode while strict leaf and folder-purity
# rules protect the conventions whose production migration has completed.
contracts:
  strict_allow_only:
    - name: models-have-no-first-party-dependencies
      id: models-have-no-first-party-dependencies
      source: model_types
      allowed: []
      reason: Models are the innermost domain representation and must not depend on another first-party namespace.

    - name: exceptions-have-no-first-party-dependencies
      id: exceptions-have-no-first-party-dependencies
      source: exception_types
      allowed: []
      reason: Exception types must be self-contained; System.Exception is a BCL base type and is intentionally outside first-party dependency checking.

  strict_layout_conventions:
    - name: abstractions-directories-contain-only-interfaces-or-abstract-classes
      id: abstractions-directories-contain-only-interfaces-or-abstract-classes
      files_matching:
        folder_segment: Abstractions
      all_declarations:
        allowed_type_kinds: [interface, class]
        require_abstract_classes: true
      reason: "An Abstractions directory is a published contract surface: interfaces are allowed, and classes must be explicitly abstract extension points."

    - name: exceptions-directories-contain-only-exceptions
      id: exceptions-directories-contain-only-exception-classes
      files_matching:
        folder_segment: Exceptions
      all_declarations:
        allowed_roles: [Exception]
      reason: Exceptions directories contain only types classified by inheritance as Exception.

    # #742 ratchet: production-types-have-one-source-declaration (below, in audit_layout_conventions)
    # stays audit-only and keeps reporting the complete debt inventory that decompose-god-classes
    # targets. This strict rule reuses the same max_declarations_per_type evidence to block any
    # *new* or *grown* handwritten production partial aggregate immediately, while the
    # ignored_violations entries below freeze today's 19 known aggregates as reviewed debt using
    # their exact current declaration count and file list. Any added, removed, or renamed
    # declaration changes that exact text, so a frozen entry only tolerates an unchanged aggregate;
    # growth, a new offender, or an improvement all surface as a failing (or newly unmatched, itself
    # failing) finding that requires a reviewed one-line policy update in the same change.
    - name: production-partial-type-declaration-count-does-not-increase
      id: production-partial-type-declaration-count-does-not-increase
      files_matching:
        folder_segment: src
      max_declarations_per_type: 1
      reason: New or grown handwritten production partial-type aggregates are blocked immediately; see #742 and the decompose-god-classes OpenSpec change for the full cleanup authority.
