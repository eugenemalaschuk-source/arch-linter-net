version: 1
name: ArchLinterNet Architecture Contract

imports:
  - policy/dependency-boundaries.arch.yml
  - policy/distribution-boundaries.arch.yml
  - policy/seam-governance.arch.yml
  - policy/public-api-and-coverage.arch.yml
  - policy/audit-conventions.arch.yml

classification:
  # These roles drive the non-blocking convention audit below. Inheritance is the
  # authoritative way to identify an exception: a name ending in "Exception" is
  # not sufficient evidence that a class is an exception.
  inheritance:
    - base_type: System.Exception
      role: Exception
  namespace:
    # Core currently uses the singular Model namespace. Keep it classified so
    # the audit makes the existing plural-folder convention violation visible.
    - namespace: ArchLinterNet.Core.Model
      role: Model
    - namespace: ArchLinterNet.Core.*.Models
      role: Model
    - namespace: ArchLinterNet.Cli.*.Models
      role: Model

layers:
  core:
    namespace: ArchLinterNet.Core
  core_model:
    namespace: ArchLinterNet.Core.Model
  core_io:
    namespace: ArchLinterNet.Core.IO
  core_reporting:
    namespace: ArchLinterNet.Core.Reporting
  core_discovery:
    namespace: ArchLinterNet.Core.Discovery
  core_resolution:
    namespace: ArchLinterNet.Core.Resolution
  core_scanning:
    namespace: ArchLinterNet.Core.Scanning
  core_contracts:
    namespace: ArchLinterNet.Core.Contracts
  core_execution:
    namespace: ArchLinterNet.Core.Execution
  core_graph:
    namespace: ArchLinterNet.Core.Graph
  core_validation:
    namespace: ArchLinterNet.Core.Validation
  core_profiling:
    namespace: ArchLinterNet.Core.Profiling
  core_asmdef:
    namespace: ArchLinterNet.Core.Asmdef
  core_composition:
    namespace: ArchLinterNet.Core.Composition
  core_schema:
    namespace: ArchLinterNet.Core.Schema
  model_types:
    selector:
      role: Model
    overlaps_with: [core, core_model]
  exception_types:
    selector:
      role: Exception
    overlaps_with: [cel, core, core_contracts, core_model, core_resolution]
  cli:
    namespace: ArchLinterNet.Cli
  cli_abstractions:
    namespace: ArchLinterNet.Cli.Abstractions
  cli_infrastructure:
    namespace: ArchLinterNet.Cli.Infrastructure
  cli_commands:
    namespace: ArchLinterNet.Cli.Commands
  testing:
    namespace: ArchLinterNet.Testing
  cel:
    namespace: ArchLinterNet.CEL

external_dependencies:
  dependency_injection_container:
    namespace_prefixes:
      - Microsoft.Extensions.DependencyInjection
  msbuild_project_evaluation:
    namespace_prefixes:
      - Buildalyzer
      - Microsoft.Build

packages:
  msbuild_project_evaluation_packages:
    package_prefixes:
      - Buildalyzer
      - Microsoft.Build
  dependency_injection_container_packages:
    package_prefixes:
      - Microsoft.Extensions.DependencyInjection
  test_frameworks:
    package_prefixes:
      - NUnit
      - xunit
      - MSTest
      - Microsoft.NET.Test.Sdk
      - coverlet
      - Moq
      - NSubstitute
      - FluentAssertions
      - BenchmarkDotNet

framework_references:
  # The SDK contributes Microsoft.NETCore.App implicitly to every net10.0 project, so it is the
  # baseline every shipped project legitimately carries, not an authored declaration.
  base_runtime_framework:
    framework_names:
      - Microsoft.NETCore.App

# Reusable source sets replace the per-layer/per-assembly copy-paste that the external, package,
# framework-reference, and project-metadata rules below would otherwise need. Every set resolves
# against a declared policy input (layer keys, analysis.target_assemblies, or the solution-discovered
# project inventory) and fails closed when a selector stops matching.
source_sets:
  # Layer-kind selectors resolve against declared `layers` keys using dot-segment globs. This
  # namespace-boundary inventory is explicit because its underscore-joined keys cannot be selected
  # with one glob. Semantic role selectors have no namespace coverage input and remain governed by
  # their enclosing namespace layer; adding a namespace layer above without adding it here remains
  # visible in review as a one-line omission.
  all_declared_layers:
    kind: layer
    members:
      - core
      - core_model
      - core_io
      - core_reporting
      - core_discovery
      - core_resolution
      - core_scanning
      - core_contracts
      - core_execution
      - core_graph
      - core_validation
      - core_profiling
      - core_asmdef
      - core_composition
      - core_schema
      - cli
      - cli_abstractions
      - cli_infrastructure
      - cli_commands
      - testing
      - cel
  shipped_assemblies:
    kind: assembly
    globs:
      - ArchLinterNet.*
  adapter_assemblies:
    kind: assembly
    members:
      - ArchLinterNet.Cli
      - ArchLinterNet.Testing
  production_projects:
    kind: project
    globs:
      - src/**

analysis:
  solution: ArchLinterNet.slnx
  project_exclude:
    - tests/**
    - benchmarks/**
  target_assemblies:
    - ArchLinterNet.Core
    - ArchLinterNet.Cli
    - ArchLinterNet.Testing
    - ArchLinterNet.CEL
  assembly_search_paths:
    - src/ArchLinterNet.Cli/bin/Debug/net10.0
    - src/ArchLinterNet.Testing/bin/Debug/net10.0
    - src/ArchLinterNet.CEL/bin/Debug/net10.0
  coverage: error
