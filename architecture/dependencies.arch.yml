version: 1
name: ArchLinterNet Architecture Contract

layers:
  core:
    namespace: ArchLinterNet.Core
  core_model:
    namespace: ArchLinterNet.Core.Model
  core_io:
    namespace: ArchLinterNet.Core.IO
  core_reporting:
    namespace: ArchLinterNet.Core.Reporting
  core_discovery:
    namespace: ArchLinterNet.Core.Discovery
  core_resolution:
    namespace: ArchLinterNet.Core.Resolution
  core_scanning:
    namespace: ArchLinterNet.Core.Scanning
  core_contracts:
    namespace: ArchLinterNet.Core.Contracts
  core_execution:
    namespace: ArchLinterNet.Core.Execution
  core_graph:
    namespace: ArchLinterNet.Core.Graph
  core_validation:
    namespace: ArchLinterNet.Core.Validation
  core_profiling:
    namespace: ArchLinterNet.Core.Profiling
  core_asmdef:
    namespace: ArchLinterNet.Core.Asmdef
  core_composition:
    namespace: ArchLinterNet.Core.Composition
  core_schema:
    namespace: ArchLinterNet.Core.Schema
  cli:
    namespace: ArchLinterNet.Cli
  cli_abstractions:
    namespace: ArchLinterNet.Cli.Abstractions
  cli_infrastructure:
    namespace: ArchLinterNet.Cli.Infrastructure
  cli_commands:
    namespace: ArchLinterNet.Cli.Commands
  testing:
    namespace: ArchLinterNet.Testing
  cel:
    namespace: ArchLinterNet.CEL

external_dependencies:
  dependency_injection_container:
    namespace_prefixes:
      - Microsoft.Extensions.DependencyInjection
  msbuild_project_evaluation:
    namespace_prefixes:
      - Buildalyzer
      - Microsoft.Build

packages:
  msbuild_project_evaluation_packages:
    package_prefixes:
      - Buildalyzer
      - Microsoft.Build
  dependency_injection_container_packages:
    package_prefixes:
      - Microsoft.Extensions.DependencyInjection
  test_frameworks:
    package_prefixes:
      - NUnit
      - xunit
      - MSTest
      - Microsoft.NET.Test.Sdk
      - coverlet
      - Moq
      - NSubstitute
      - FluentAssertions
      - BenchmarkDotNet

framework_references:
  # The SDK contributes Microsoft.NETCore.App implicitly to every net10.0 project, so it is the
  # baseline every shipped project legitimately carries, not an authored declaration.
  base_runtime_framework:
    framework_names:
      - Microsoft.NETCore.App

# Reusable source sets replace the per-layer/per-assembly copy-paste that the external, package,
# framework-reference, and project-metadata rules below would otherwise need. Every set resolves
# against a declared policy input (layer keys, analysis.target_assemblies, or the solution-discovered
# project inventory) and fails closed when a selector stops matching.
source_sets:
  # Layer-kind selectors resolve against declared `layers` keys using dot-segment globs; because
  # every layer key here is a single underscore-joined segment, no glob can express "every declared
  # layer" and the inventory is listed explicitly. Adding a layer above without adding it here is
  # visible in review as a one-line omission next to the layer declaration.
  all_declared_layers:
    kind: layer
    members:
      - core
      - core_model
      - core_io
      - core_reporting
      - core_discovery
      - core_resolution
      - core_scanning
      - core_contracts
      - core_execution
      - core_graph
      - core_validation
      - core_profiling
      - core_asmdef
      - core_composition
      - core_schema
      - cli
      - cli_abstractions
      - cli_infrastructure
      - cli_commands
      - testing
      - cel
  shipped_assemblies:
    kind: assembly
    globs:
      - ArchLinterNet.*
  adapter_assemblies:
    kind: assembly
    members:
      - ArchLinterNet.Cli
      - ArchLinterNet.Testing
  production_projects:
    kind: project
    globs:
      - src/**

analysis:
  solution: ArchLinterNet.slnx
  project_exclude:
    - tests/**
    - benchmarks/**
  target_assemblies:
    - ArchLinterNet.Core
    - ArchLinterNet.Cli
    - ArchLinterNet.Testing
    - ArchLinterNet.CEL
  assembly_search_paths:
    - src/ArchLinterNet.Cli/bin/Debug/net10.0
    - src/ArchLinterNet.Testing/bin/Debug/net10.0
    - src/ArchLinterNet.CEL/bin/Debug/net10.0
  coverage: error

contracts:
  strict:
    - name: cli-must-not-depend-on-testing
      id: cli-must-not-depend-on-testing
      source: cli
      forbidden: [testing]
      reason: CLI should only depend on Core.

    - name: testing-must-not-depend-on-cli
      id: testing-must-not-depend-on-cli
      source: testing
      forbidden: [cli]
      reason: Testing adapter should only depend on Core.

    - name: cli-must-use-validation-application-seam
      id: cli-must-use-validation-application-seam
      source: cli
      forbidden: [core_execution, core_contracts, core_resolution, core_scanning]
      reason: CLI must call the Core.Validation application seam instead of constructing contract runners or loading policies directly.

    - name: cli-abstractions-must-stay-separate-from-infrastructure-and-command-implementations
      id: cli-abstractions-must-stay-separate-from-infrastructure-and-command-implementations
      source: cli_abstractions
      forbidden: [cli_infrastructure, cli_commands, testing, core_execution, core_contracts, core_resolution, core_scanning, core_discovery]
      reason: CLI abstractions must remain a narrow contract boundary and must not drift into infrastructure details, command implementations, or Core internals below the application seam.

    - name: cli-commands-must-not-depend-on-cli-infrastructure
      id: cli-commands-must-not-depend-on-cli-infrastructure
      source: cli_commands
      forbidden: [cli_infrastructure]
      reason: CLI commands must depend on CLI abstractions, not concrete host/runtime/file-system infrastructure implementations.

    - name: cli-infrastructure-must-not-depend-on-cli-command-implementations
      id: cli-infrastructure-must-not-depend-on-cli-command-implementations
      source: cli_infrastructure
      forbidden: [cli_commands]
      reason: CLI infrastructure should compose command modules through abstractions and discovery, not by coupling back to command implementation namespaces.

    - name: testing-must-use-validation-application-seam
      id: testing-must-use-validation-application-seam
      source: testing
      forbidden: [core_execution, core_contracts, core_resolution, core_scanning]
      reason: Testing adapter must call the composed validation seam instead of constructing contract runners, loading policies, resolving roots, or scanning directly.

    - name: core-execution-must-not-depend-on-hosts
      id: core-execution-must-not-depend-on-hosts
      source: core_execution
      forbidden: [cli, testing]
      reason: Contract execution and handler internals must stay usable from any host and must not couple back to a specific CLI or testing adapter.

    - name: core-graph-must-not-depend-on-hosts
      id: core-graph-must-not-depend-on-hosts
      source: core_graph
      forbidden: [cli, testing]
      reason: The dependency graph and explain application seam must stay usable from any host and must not couple back to a specific CLI or testing adapter.

    - name: core-reporting-stays-a-diagnostics-leaf
      id: core-reporting-stays-a-diagnostics-leaf
      source: core_reporting
      forbidden: [cli, testing, core_execution, core_validation, core_resolution, core_scanning, core_contracts]
      reason: Diagnostics formatting is a leaf consumed by higher layers and must not depend back on business logic.

    - name: core-model-stays-independent
      id: core-model-stays-independent
      source: core_model
      forbidden: [cli, testing, core_execution, core_validation, core_resolution, core_scanning, core_contracts, core_reporting]
      reason: Model types are the most fundamental layer and must not depend on anything else.

    - name: core-io-stays-independent
      id: core-io-stays-independent
      source: core_io
      forbidden: [cli, testing, core_execution, core_validation, core_resolution, core_scanning, core_contracts, core_reporting, core_discovery, core_composition]
      reason: Infrastructure seams (file system, environment, assembly loading, Roslyn compilation) are a fundamental replaceable boundary and must not depend on the business logic layers that consume them.

    - name: core-resolution-must-not-depend-on-execution-or-validation
      id: core-resolution-must-not-depend-on-execution-or-validation
      source: core_resolution
      forbidden: [core_execution, core_validation, cli, testing]
      reason: Repository and assembly resolution must not depend upward on contract execution or the application seam.

    - name: core-scanning-must-not-depend-on-execution-or-validation
      id: core-scanning-must-not-depend-on-execution-or-validation
      source: core_scanning
      forbidden: [core_execution, core_validation, cli, testing]
      reason: Scanning internals must not depend upward on contract execution or the application seam.

    - name: core-discovery-must-not-depend-on-execution-or-validation
      id: core-discovery-must-not-depend-on-execution-or-validation
      source: core_discovery
      forbidden: [core_execution, core_validation, cli, testing]
      reason: Project/solution discovery internals must not depend upward on contract execution or the application seam.

    - name: core-validation-must-not-bypass-application-internals
      id: core-validation-must-not-bypass-application-internals
      source: core_validation
      forbidden: [core_scanning, core_discovery, core_resolution, core_io]
      reason: The validation application seam must reach scanning, discovery, resolution, and infrastructure IO only through Core.Execution, while asmdef-only validation remains in Core.Asmdef.

    - name: core-contracts-must-not-depend-on-hosts
      id: core-contracts-must-not-depend-on-hosts
      source: core_contracts
      forbidden: [cli, testing]
      reason: Contract-family and validator internals must stay usable from any host and must not couple back to a specific CLI or testing adapter.

    - name: core-contracts-must-not-depend-on-execution
      id: core-contracts-must-not-depend-on-execution
      source: core_contracts
      forbidden: [core_execution]
      reason: Contracts must stay independent of Execution's runtime checker/registry internals; the deliberately-duplicated ArchitectureContractFamilyBindings/ArchitectureContractFamilyBinding registry depends on this separation holding.

    - name: cel-must-not-depend-on-core
      id: cel-must-not-depend-on-core
      source: cel
      forbidden: [core]
      reason: CEL is an independently buildable engine; it must not depend on Core to remain host-agnostic and usable in isolation.

    - name: cel-must-not-depend-on-cli
      id: cel-must-not-depend-on-cli
      source: cel
      forbidden: [cli]
      reason: CEL must not depend on the CLI adapter.

    - name: cel-must-not-depend-on-testing
      id: cel-must-not-depend-on-testing
      source: cel
      forbidden: [testing]
      reason: CEL must not depend on the testing adapter.

  strict_external:
    # One authored rule per external boundary, expanded across every declared layer through the
    # all_declared_layers source set. Exclusions name the exact layers where the dependency is the
    # architecture, not a leak: `core` is the umbrella namespace that contains the allowed child
    # layer, so it is subtracted alongside it.
    - name: di-container-stays-in-the-composition-boundary
      id: di-container-stays-in-the-composition-boundary
      source_sets: [all_declared_layers]
      exclude_sources: [core, core_composition]
      forbidden: [dependency_injection_container]
      reason: Container APIs must stay confined to ArchLinterNet.Core.Composition; every other layer consumes the composition root's interfaces and facades.

    - name: msbuild-project-evaluation-stays-in-discovery
      id: msbuild-project-evaluation-stays-in-discovery
      source_sets: [all_declared_layers]
      exclude_sources: [core, core_discovery]
      forbidden: [msbuild_project_evaluation]
      reason: MSBuild/Buildalyzer project-evaluation APIs must stay confined to ArchLinterNet.Core.Discovery; every other layer consumes the resolved project facts.

  strict_assembly_dependency:
    - name: cel-assembly-must-not-reference-other-shipped-assemblies
      id: cel-assembly-must-not-reference-other-shipped-assemblies
      source: ArchLinterNet.CEL
      forbidden: [ArchLinterNet.Core, ArchLinterNet.Cli, ArchLinterNet.Testing]
      reason: CEL ships as an independently usable, host-agnostic engine. A namespace rule only fires once code uses a type; this catches the declared assembly reference itself.

  strict_assembly_allow_only:
    - name: core-assembly-references-only-cel
      id: core-assembly-references-only-cel
      source: ArchLinterNet.Core
      allowed: [ArchLinterNet.CEL]
      reason: The shipped engine assembly may take a direct first-party reference on CEL and nothing else, so a host or adapter reference is caught at declaration time.

    - name: adapter-assemblies-reference-only-core
      id: adapter-assemblies-reference-only-core
      source_sets: [adapter_assemblies]
      allowed: [ArchLinterNet.Core]
      reason: The CLI and NUnit adapters consume the engine through ArchLinterNet.Core only; a direct CEL or cross-adapter assembly reference is a packaging regression.

  strict_assembly_independence:
    - name: adapter-assemblies-are-mutually-independent
      id: adapter-assemblies-are-mutually-independent
      assemblies: [ArchLinterNet.Cli, ArchLinterNet.Testing]
      reason: The CLI tool and the NUnit adapter are separately consumable packages and must not reference each other in either direction.

  strict_project_metadata:
    - name: production-projects-must-not-reference-test-or-benchmark-projects
      id: production-projects-must-not-reference-test-or-benchmark-projects
      project_sets: [production_projects]
      forbidden_project_references:
        - tests/**/*.csproj
        - benchmarks/**/*.csproj
      forbidden_properties:
        IsTestProject: "true"
      reason: A shipped project must never take a build dependency on a test or benchmark project, or turn itself into a test project.

    - name: core-friend-assemblies-are-reviewed
      id: core-friend-assemblies-are-reviewed
      projects: [src/ArchLinterNet.Core/ArchLinterNet.Core.csproj]
      allowed_friend_assemblies:
        - ArchLinterNet.Core.Tests
        - ArchLinterNet.Cli
      reason: Core's internals are deliberately visible to its own test assembly and to the CLI adapter; any further friend assembly widens the effective API surface without review.

    - name: cel-friend-assemblies-are-reviewed
      id: cel-friend-assemblies-are-reviewed
      projects: [src/ArchLinterNet.CEL/ArchLinterNet.CEL.csproj]
      allowed_friend_assemblies:
        - ArchLinterNet.CEL.Tests
        - ArchLinterNet.CEL.Benchmarks
      reason: CEL's internal pipeline stages are visible only to its own tests and to the pipeline-stage benchmarks; consumers must stay on the public CelEnvironment surface.

    - name: cli-friend-assemblies-are-reviewed
      id: cli-friend-assemblies-are-reviewed
      projects: [src/ArchLinterNet.Cli/ArchLinterNet.Cli.csproj]
      allowed_friend_assemblies:
        - ArchLinterNet.Cli.Tests
      reason: The CLI's internals are visible only to its own test assembly.

    - name: testing-adapter-declares-no-friend-assemblies
      id: testing-adapter-declares-no-friend-assemblies
      projects: [src/ArchLinterNet.Testing/ArchLinterNet.Testing.csproj]
      allowed_friend_assemblies: []
      reason: The NUnit adapter is consumed entirely through its public API; it has no reviewed friend assembly.

  strict_package_dependency:
    - name: test-frameworks-stay-out-of-shipped-projects
      id: test-frameworks-stay-out-of-shipped-projects
      source_sets: [shipped_assemblies]
      forbidden: [test_frameworks]
      reason: A shipped package must not declare a test or benchmark framework dependency and push it onto consumers.

    - name: msbuild-project-evaluation-package-stays-in-core
      id: msbuild-project-evaluation-package-stays-in-core
      source_sets: [shipped_assemblies]
      exclude_sources: [ArchLinterNet.Core]
      forbidden: [msbuild_project_evaluation_packages]
      reason: Buildalyzer/MSBuild project evaluation is an ArchLinterNet.Core implementation detail; declaring it elsewhere would move project evaluation out of Core.Discovery.

    - name: di-container-package-stays-in-core
      id: di-container-package-stays-in-core
      source_sets: [shipped_assemblies]
      exclude_sources: [ArchLinterNet.Core]
      forbidden: [dependency_injection_container_packages]
      reason: The container is Core's composition-root implementation detail; an adapter declaring it directly would bypass the composition facade.

  strict_package_allow_only:
    - name: cel-declares-no-package-dependencies
      id: cel-declares-no-package-dependencies
      source: ArchLinterNet.CEL
      allowed: []
      reason: CEL is the dependency-light, host-agnostic engine; its value is that it can be referenced with no transitive package graph at all.

  strict_framework_allow_only:
    - name: shipped-projects-declare-only-the-base-runtime-framework
      id: shipped-projects-declare-only-the-base-runtime-framework
      source_sets: [shipped_assemblies]
      allowed: [base_runtime_framework]
      reason: Every shipped project carries only the implicit base runtime framework. Adopting a shared framework such as Microsoft.AspNetCore.App or Microsoft.WindowsDesktop.App would silently narrow which hosts can consume the packages.

  strict_layers:
    - name: core-layering
      id: core-layering
      layers:
        - cli
        - testing
        - core
        - cel
      reason: Dependencies must point toward Core and CEL; CEL sits below Core and must not depend upward.

    - name: core-application-seam-layering
      id: core-application-seam-layering
      layers:
        - cli
        - core_validation
        - core_execution
        - core_model
      reason: CLI calls the Core.Validation application seam, which orchestrates Core.Execution, which ultimately rests on Core.Model.

  strict_cycles:
    - name: package-cycles
      id: package-cycles
      layers:
        - cel
        - core
        - cli
        - testing
      reason: Packages must not form dependency cycles.

  strict_protected:
    - name: core-scanning-internals-are-protected
      id: core-scanning-internals-are-protected
      protected: [core_scanning]
      allowed_importers: [core]
      reason: Scanning internals must not be referenced outside Core.

    - name: core-discovery-internals-are-protected
      id: core-discovery-internals-are-protected
      protected: [core_discovery]
      allowed_importers: [core]
      reason: Project/solution discovery internals must not be referenced outside Core.

    - name: core-resolution-internals-are-protected
      id: core-resolution-internals-are-protected
      protected: [core_resolution]
      allowed_importers: [core]
      reason: Repository and assembly resolution internals must not be referenced outside Core.

  strict_type_placement:
    # Post-#452 seam: a new contract-family checker must be a type under the extracted checker
    # namespace, not a new type grown next to the analysis session. Name-suffix matching is used
    # deliberately here: checkers are static classes bound through the ArchitectureContractChecker
    # delegate, so there is no interface or base type to select them by.
    - name: family-checkers-stay-in-the-extracted-checker-seam
      id: family-checkers-stay-in-the-extracted-checker-seam
      types_matching:
        name_suffix: Checker
      exclude_types_matching:
        # ArchitectureContractChecker is the delegate the seam is defined by, not a checker.
        - base_type: System.MulticastDelegate
      must_reside_in_namespaces: [ArchLinterNet.Core.Execution.Checkers]
      reason: Contract-family checking was extracted out of ArchitectureAnalysisSession (#452); a checker type declared anywhere else re-centralizes family logic.

    # Post-#453 seam: the diagnostic model owns every diagnostic type, so the reporting formatter
    # projects details through the registry instead of switching on host- or execution-owned types.
    - name: diagnostics-stay-in-the-model-layer
      id: diagnostics-stay-in-the-model-layer
      types_matching:
        base_type: ArchLinterNet.Core.Model.ArchitectureDiagnostic
      must_reside_in_layers: [core_model]
      reason: Every diagnostic family is a Core.Model type; declaring one in Reporting or Execution would couple diagnostic shape to a producer or a formatter.

  strict_interface_implementation:
    - name: diagnostic-detail-payloads-stay-in-the-model-layer
      id: diagnostic-detail-payloads-stay-in-the-model-layer
      interfaces: [ArchLinterNet.Core.Model.IArchitectureDiagnosticPayload]
      allowed_only_in_layers: [core_model]
      reason: The #453 detail-projection seam depends on every structured payload being a Core.Model type the formatter can project without knowing its producer.

    # Post-#451 seam: policy loading owns raw-YAML validation and document validation in two
    # dedicated namespaces, keeping the loader itself free of per-family validation branches.
    - name: raw-policy-document-validators-stay-in-their-loading-seam
      id: raw-policy-document-validators-stay-in-their-loading-seam
      interfaces: [ArchLinterNet.Core.Contracts.RawValidators.IArchitecturePolicyRawDocumentValidator]
      allowed_only_in_namespaces: [ArchLinterNet.Core.Contracts.RawValidators]
      reason: Raw-node validation is a focused loading-stage contributor set (#451); implementing one elsewhere would reintroduce validation branches into the policy loader.

    - name: policy-document-validators-stay-in-their-loading-seam
      id: policy-document-validators-stay-in-their-loading-seam
      interfaces: [ArchLinterNet.Core.Contracts.Validators.IArchitecturePolicyDocumentValidator]
      allowed_only_in_namespaces: [ArchLinterNet.Core.Contracts.Validators]
      reason: Typed document validation is a focused loading-stage contributor set (#451); implementing one elsewhere would reintroduce validation branches into the policy loader.

  strict_public_api_surface:
    # Reviewed compatibility surfaces, captured through `arch-linter-net public-api capture` and
    # updated only through the explicit `make public-api-update` entrypoint. api_comparison: exact
    # makes additions, removals, and signature changes all reviewed deltas.
    - name: cel-public-api-is-reviewed
      id: cel-public-api-is-reviewed
      assemblies: [ArchLinterNet.CEL]
      api_snapshot: architecture/api/ArchLinterNet.CEL.public-api.txt
      api_comparison: exact
      reason: CEL ships as a standalone engine package; its whole exported surface is the compatibility contract.

    - name: testing-public-api-is-reviewed
      id: testing-public-api-is-reviewed
      assemblies: [ArchLinterNet.Testing]
      api_snapshot: architecture/api/ArchLinterNet.Testing.public-api.txt
      api_comparison: exact
      reason: The NUnit adapter is consumed entirely through its public API, so every exported member is the compatibility contract.

    - name: core-public-api-is-reviewed
      id: core-public-api-is-reviewed
      assemblies: [ArchLinterNet.Core]
      api_snapshot: architecture/api/ArchLinterNet.Core.public-api.txt
      api_comparison: exact
      reason: Core is the engine package consumers reference directly; its whole exported surface is the compatibility contract.

  strict_coverage:
    - name: assembly-coverage
      id: assembly-coverage
      scope: assembly
      reason: Every first-party assembly must be mapped to a declared layer or explicitly excluded.

    - name: project-coverage
      id: project-coverage
      scope: project
      reason: Every first-party production project discovered from ArchLinterNet.slnx must be mapped to a declared layer, so a newly added src/ project cannot silently escape governance.

    - name: namespace-coverage
      id: namespace-coverage
      scope: namespace
      roots:
        - namespace: ArchLinterNet.Core
        - namespace: ArchLinterNet.Cli
        - namespace: ArchLinterNet.Testing
        - namespace: ArchLinterNet.CEL
      reason: Every first-party root namespace must be mapped to a declared layer or explicitly excluded.

    - name: self-policy-rule-input-coverage
      id: self-policy-rule-input-coverage
      scope: rule_input
      contract_ids:
        - cli-must-not-depend-on-testing
        - testing-must-not-depend-on-cli
        - cli-must-use-validation-application-seam
        - testing-must-use-validation-application-seam
        - core-execution-must-not-depend-on-hosts
        - core-reporting-stays-a-diagnostics-leaf
        - core-model-stays-independent
        - core-io-stays-independent
        - core-resolution-must-not-depend-on-execution-or-validation
        - core-scanning-must-not-depend-on-execution-or-validation
        - core-discovery-must-not-depend-on-execution-or-validation
        - core-validation-must-not-bypass-application-internals
        - core-scanning-internals-are-protected
        - core-discovery-internals-are-protected
        - core-resolution-internals-are-protected
        - core-layering
        - core-application-seam-layering
        - package-cycles
        - core-contracts-must-not-depend-on-hosts
        - core-contracts-must-not-depend-on-execution
        - cel-must-not-depend-on-core
        - cel-must-not-depend-on-cli
        - cel-must-not-depend-on-testing
        - di-container-stays-in-the-composition-boundary
        - msbuild-project-evaluation-stays-in-discovery
      reason: The recovered Core architecture's base package rules, seam, leaf-isolation, and protected-surface rules must keep matching real code so a renamed or deleted layer cannot silently stop being enforced.
