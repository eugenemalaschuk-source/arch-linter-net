version: 1
name: Metric CLI explicit project ownership
analysis:
  target_assemblies: [ArchLinterNet.Testing]
  projects:
    - ../../../src/ArchLinterNet.Testing/ArchLinterNet.Testing.csproj
topology:
  mode: partial
  subject_kind: type
  scope:
    selectors:
      - namespace: ArchLinterNet.Testing
  nodes:
    - id: application
      mappings:
        - namespace: ArchLinterNet.Testing
metrics:
  - id: application-project-footprint
    kind: component_footprint_count
    topology_node: application
    unit: project
contracts: {}
