version: 1
name: Synthetic large multi-host adopter
layers:
  synthetic:
    namespace: Synthetic
analysis:
  projects:
    - src/Synthetic.HostA/Synthetic.HostA.csproj
    - src/Synthetic.HostB/Synthetic.HostB.csproj
    - src/Synthetic.HostC/Synthetic.HostC.csproj
    - src/Synthetic.HostD/Synthetic.HostD.csproj
    - src/Synthetic.HostE/Synthetic.HostE.csproj
    - src/Synthetic.HostF/Synthetic.HostF.csproj
    - src/Synthetic.HostG/Synthetic.HostG.csproj
    - src/Synthetic.HostH/Synthetic.HostH.csproj
    - src/Synthetic.SharedLib1/Synthetic.SharedLib1.csproj
    - src/Synthetic.SharedLib2/Synthetic.SharedLib2.csproj
contracts:
  strict:
    - id: synthetic-full-assembly-scan
      name: synthetic-full-assembly-scan
      source: synthetic
      forbidden: []
      reason: Exercise the representative dependency scan workload for release profiling.
  strict_layout_conventions:
    - id: synthetic-fact-index-scan
      name: synthetic-fact-index-scan
      files_matching:
        namespace_segment: Synthetic
      forbidden_name_prefix: __never__
      reason: Materialize the type/source fact index across every synthetic assembly partition.
